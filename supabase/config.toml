[functions.v2-search-usda-ingredients]
verify_jwt = true

[functions.v2-lookup-food-barcode]
verify_jwt = true

[functions.v2-search-openfoodfacts-products]
verify_jwt = true

# ALL-251: staged deletion worker. JWT required on top of private worker token.
# No Edge Function deployed or processing gate enabled by this setting.
[functions.v2-account-deletion-worker]
verify_jwt = true

# ALL-252: source-only, DEFAULT-OFF web sandbox billing entrypoint.
# verify_jwt never disabled; additionally verifies user via Auth.getUser.
# ALLIN_BILLING_SANDBOX_ARMED is unset/false until private SQL & security review.
[functions.v2-stripe-sandbox-checkout]
verify_jwt = true

# ALL-252: STAGED ONLY, DEFAULT OFF. Stripe webhooks carry no Supabase JWT.
# Endpoint verifies the exact raw Stripe signature with a configured secret;
# ALLIN_STRIPE_SANDBOX_WEBHOOK_ARMED must remain unset until review/deploy.
[functions.v2-stripe-sandbox-webhook]
verify_jwt = false
