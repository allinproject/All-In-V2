name: ALL-251 temporary hosted Storage acceptance (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: all251-temporary-hosted-storage
  cancel-in-progress: false

jobs:
  temporary-staging-only:
    name: Approved temporary Supabase project ONLY
    if: github.ref == 'refs/heads/integration/v2-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: all251-temporary-staging
    env:
      CI: '1'
      ALL251_ALLOW_HOSTED_TEST: 'true'
      ALL251_HOSTED_PROJECT_REF: fbtgknlxjyeqrxemskbl
      ALL251_HOSTED_URL: https://fbtgknlxjyeqrxemskbl.supabase.co
      ALL251_HOSTED_SECRET_KEY: ${{ secrets.ALL251_TEMP_STAGING_SECRET_KEY }}
      ALL251_HOSTED_PUBLISHABLE_KEY: ${{ secrets.ALL251_TEMP_STAGING_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Require isolated staging credentials
        run: |
          test -n "$ALL251_HOSTED_SECRET_KEY"
          test -n "$ALL251_HOSTED_PUBLISHABLE_KEY"
          test "$ALL251_HOSTED_PROJECT_REF" = fbtgknlxjyeqrxemskbl
      - name: Run existing encrypted private Storage acceptance with synthetic files
        run: node scripts/test-v2-account-export-real-local-storage.mjs

# MANUAL ONLY. This workflow never touches live V2, V1 or deploys an Edge
# function. Do not configure secrets belonging to either existing live project.
# Remove this temporary workflow and the dedicated project after acceptance.