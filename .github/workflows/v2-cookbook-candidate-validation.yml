name: V2 Cookbook candidate validation (no deploy)

on:
  push:
    branches: [integration/v2-foundation]
    paths:
      - 'scripts/validate-cookbook-candidates.cjs'
      - 'scripts/validate-cookbook-candidates.test.cjs'
      - 'scripts/cookbook-review-triage.cjs'
      - 'scripts/cookbook-review-triage.test.cjs'
      - 'scripts/review-v2-ingredient-identities.cjs'
      - 'scripts/review-v2-ingredient-identities.test.cjs'
      - 'scripts/check-v2-usda-nutrient-policy.cjs'
      - 'scripts/check-v2-usda-nutrient-policy.test.cjs'
      - 'scripts/review-v2-usda-source-admission.cjs'
      - 'scripts/review-v2-usda-source-admission.test.cjs'
      - 'scripts/run-v2-ingredient-auto-qualification.cjs'
      - 'scripts/run-v2-ingredient-auto-qualification.test.cjs'
      - 'docs/architecture/sql/V2-INGREDIENT-CANONICAL-CATALOG-SCHEMA-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-INGREDIENT-CANONICAL-REVIEW-WRITER-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-INGREDIENT-OPERATOR-CREDENTIAL-LIFECYCLE-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-INGREDIENT-USDA-ENERGY-ATTESTATION-CANDIDATE.sql'
      - 'docs/evidence/ALL-225-USDA-EIGHT-PER-FOOD-ENERGY-DIGESTS-2026-11-12.json'
      - 'scripts/test-v2-ingredient-energy-attestation-isolated.cjs'
      - 'scripts/test-v2-ingredient-native-concurrency.py'
      - 'scripts/check-v2-ingredient-writer-candidate.test.cjs'
      - 'scripts/check-v2-ingredient-hosted-reviewer-connection.cjs'
      - 'scripts/check-v2-ingredient-hosted-reviewer-connection.test.cjs'
      - 'scripts/test-v2-ingredient-review-writer-isolated.cjs'
      - 'apps/mobile-v2/src/features/cookbook/localIngredientProfiles.ts'
      - 'apps/mobile-v2/src/features/cookbook/recipeNutritionCalculator.ts'
      - 'docs/evidence/ALL-228-EIGHT-DIRECT-FDC-FOOD-FORM-NUTRIENT-BASIS-2026-11-12.json'
      - 'docs/evidence/ALL-228-EIGHT-REVIEWED-SOURCE-BINDINGS-2026-11-12.json'
      - 'docs/evidence/ALL-228-EIGHT-ALIAS-AND-PREPARATION-ACCEPTANCE-CANDIDATES-2026-11-12.json'
      - 'scripts/reconcile-usda-foundation-identities.py'
      - 'scripts/reconcile-usda-foundation-identities.test.cjs'
      - '.github/workflows/v2-cookbook-candidate-validation.yml'
  pull_request:
    paths:
      - 'scripts/validate-cookbook-candidates.cjs'
      - 'scripts/validate-cookbook-candidates.test.cjs'
      - 'scripts/cookbook-review-triage.cjs'
      - 'scripts/cookbook-review-triage.test.cjs'
      - 'scripts/review-v2-ingredient-identities.cjs'
      - 'scripts/review-v2-ingredient-identities.test.cjs'
      - 'scripts/check-v2-usda-nutrient-policy.cjs'
      - 'scripts/check-v2-usda-nutrient-policy.test.cjs'
      - 'scripts/review-v2-usda-source-admission.cjs'
      - 'scripts/review-v2-usda-source-admission.test.cjs'
      - 'scripts/run-v2-ingredient-auto-qualification.cjs'
      - 'scripts/run-v2-ingredient-auto-qualification.test.cjs'
      - 'docs/architecture/sql/V2-INGREDIENT-CANONICAL-CATALOG-SCHEMA-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-INGREDIENT-CANONICAL-REVIEW-WRITER-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-INGREDIENT-OPERATOR-CREDENTIAL-LIFECYCLE-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-INGREDIENT-USDA-ENERGY-ATTESTATION-CANDIDATE.sql'
      - 'docs/evidence/ALL-225-USDA-EIGHT-PER-FOOD-ENERGY-DIGESTS-2026-11-12.json'
      - 'scripts/test-v2-ingredient-energy-attestation-isolated.cjs'
      - 'scripts/test-v2-ingredient-native-concurrency.py'
      - 'scripts/check-v2-ingredient-writer-candidate.test.cjs'
      - 'scripts/check-v2-ingredient-hosted-reviewer-connection.cjs'
      - 'scripts/check-v2-ingredient-hosted-reviewer-connection.test.cjs'
      - 'scripts/test-v2-ingredient-review-writer-isolated.cjs'
      - 'apps/mobile-v2/src/features/cookbook/localIngredientProfiles.ts'
      - 'apps/mobile-v2/src/features/cookbook/recipeNutritionCalculator.ts'
      - 'docs/evidence/ALL-228-EIGHT-DIRECT-FDC-FOOD-FORM-NUTRIENT-BASIS-2026-11-12.json'
      - 'docs/evidence/ALL-228-EIGHT-REVIEWED-SOURCE-BINDINGS-2026-11-12.json'
      - 'docs/evidence/ALL-228-EIGHT-ALIAS-AND-PREPARATION-ACCEPTANCE-CANDIDATES-2026-11-12.json'
      - 'scripts/reconcile-usda-foundation-identities.py'
      - 'scripts/reconcile-usda-foundation-identities.test.cjs'
      - '.github/workflows/v2-cookbook-candidate-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cookbook-candidates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-only-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Reject malformed and unsafe staged source candidates
        run: node --test scripts/validate-cookbook-candidates.test.cjs
      - name: Test review-only recipe triage and freezer-kit lifecycle
        run: node --test scripts/cookbook-review-triage.test.cjs
      - name: Verify candidate ingredient identity isolation and source gates
        run: node --test scripts/review-v2-ingredient-identities.test.cjs
      - name: Validate versioned USDA energy and nutrient completeness policy
        run: node --test scripts/check-v2-usda-nutrient-policy.test.cjs
      - name: Test source-to-canonical-review-to-calculator staging path (no writes)
        run: node --experimental-strip-types --test scripts/review-v2-usda-source-admission.test.cjs
      - name: Test automatic ingredient qualification through existing canonical writer transaction
        run: node --test scripts/run-v2-ingredient-auto-qualification.test.cjs
      - name: Verify canonical ingredient SQL writer guards without deployment
        run: node --test scripts/check-v2-ingredient-writer-candidate.test.cjs
      - name: Check read-only hosted reviewer connection safety preflight (no credential required)
        run: node --test scripts/check-v2-ingredient-hosted-reviewer-connection.test.cjs
      - name: Test pinned USDA reconciliation and no-auto-approval gates
        run: node --test scripts/reconcile-usda-foundation-identities.test.cjs
