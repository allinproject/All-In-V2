name: ALL-228 USDA Foundation source inspection (one shot, no import)

on:
  push:
    branches:
      - integration/v2-foundation
    paths:
      - '.github/workflows/all228-usda-foundation-source-inspect.yml'

permissions:
  contents: read

jobs:
  inspect-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download official Foundation October 2026 archive to temporary runner
        env:
          USDA_URL: https://fdc.nal.usda.gov/fdc-datasets/FoodData_Central_foundation_food_json_2026-10-29.zip
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 80 --silent --show-error "$USDA_URL" -o /tmp/usda-foundation.zip
          test "$(stat -c %s /tmp/usda-foundation.zip)" -gt 10000
          unzip -t /tmp/usda-foundation.zip >/dev/null
          sha256sum /tmp/usda-foundation.zip
          python3 - <<'PY'
          import hashlib,json,zipfile,os
          path='/tmp/usda-foundation.zip'
          with zipfile.ZipFile(path) as z:
              infos=z.infolist()
              if len(infos)>40: raise RuntimeError('Unexpected member count')
              names=[x.filename for x in infos]
              if len(names)!=len(set(names)): raise RuntimeError('Duplicate members')
              for name in names:
                  if name.startswith('/') or '\\' in name or '..' in name.split('/') or any(ord(c)<32 for c in name):
                      raise RuntimeError('Unsafe archive member')
              json_names=[x for x in names if x.lower().endswith('.json')]
              if len(json_names)!=1: raise RuntimeError('Unexpected JSON member count')
              data=z.read(json_names[0])
              if len(data)>50000000: raise RuntimeError('Excessive JSON length')
              obj=json.loads(data)
              open('/tmp/usda-foundation.json','wb').write(data)
              print('USDA_SOURCE_BYTES',os.path.getsize(path))
              print('USDA_SOURCE_SHA256',hashlib.sha256(open(path,'rb').read()).hexdigest())
              print('USDA_JSON_MEMBER',json_names[0])
              print('USDA_JSON_ROOT_KEYS',sorted(obj) if isinstance(obj,dict) else type(obj).__name__)
              if isinstance(obj,dict):
                  for key,value in obj.items():
                      if isinstance(value,list):
                          print('USDA_COLLECTION_NAME',key,'COUNT',len(value))
                          if value and isinstance(value[0],dict):
                              sample=value[0]
                              print('USDA_FIRST_RECORD_FIELD_NAMES',sorted(sample))
                              print('USDA_FIRST_RECORD_NUTRIENT_FIELD_NAMES',sorted(sample.get('foodNutrients',[{}])[0]) if sample.get('foodNutrients') else [])
          PY
      - name: Preview real USDA source candidates without writing to catalog
        run: |
          node --experimental-strip-types --test scripts/inspect-v2-usda-foundation-candidates.test.mjs
          node --experimental-strip-types scripts/inspect-v2-usda-foundation-candidates.mjs /tmp/usda-foundation.json dd414cc9f1a132626bad354ef6655972c78b44aff14f16114dc899708663c579
      - name: No import and no persisted archive
        run: |
          echo 'Source inspection only; no databases, repository writes or exports.'
