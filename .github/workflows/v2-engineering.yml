name: V2 Engineering validation (no deploy)

on:
  push:
    branches:
      - integration/v2-foundation
    paths:
      - 'apps/mobile-v2/**'
      - 'supabase/config.toml'
      - 'scripts/check-v2-supabase-target.mjs'
      - 'scripts/check-v2-supabase-target.test.mjs'
      - '.github/workflows/v2-engineering.yml'
  pull_request:
    paths:
      - 'apps/mobile-v2/**'
      - 'supabase/config.toml'
      - 'scripts/check-v2-supabase-target.mjs'
      - 'scripts/check-v2-supabase-target.test.mjs'
      - '.github/workflows/v2-engineering.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-engineering-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: npm install, tests, TypeScript and Expo bundles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile-v2
    env:
      # Public, deliberately nonfunctional CI values; no production credentials.
      EXPO_PUBLIC_SUPABASE_URL: https://xarhuczrtzuiljmtdaeu.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify V2 target isolation
        run: node ../../scripts/check-v2-supabase-target.mjs
      - name: Generate real npm lockfile for review
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Preserve generated npm lockfile (not committed)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: v2-package-lock-${{ github.run_id }}
          path: apps/mobile-v2/package-lock.json
          if-no-files-found: warn
          retention-days: 7
      - name: Clean dependency install
        run: npm ci --no-audit --no-fund
      - name: Test Auth, Legal and Onboarding
        run: npm run test:auth
      - name: Test Cookbook nutrition
        run: npm run test:calculator
      - name: Test Training logic
        run: npm run test:training-logic
      - name: TypeScript correctness
        run: npm run typecheck
      - name: Expo config validation
        run: npx --no-install expo config --type public
      - name: Expo iOS and Android JavaScript bundles
        run: npx --no-install expo export --platform all --output-dir /tmp/allin365-v2-export
