name: V2 Engineering validation (no deploy)

on:
  # Targeted integration acceptance runs only for workflow changes.
  # Ordinary source pushes do not start the full npm/Expo job.
  push:
    branches: [integration/v2-foundation]
    paths:
      - '.github/workflows/v2-engineering.yml'
      - 'apps/mobile-v2/eas.json'
      - 'scripts/check-v2-founder-ios-build.mjs'
      - 'scripts/check-v2-founder-ios-build.test.mjs'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'apps/mobile-v2/**'
      - 'supabase/config.toml'
      - 'scripts/check-v2-supabase-target.mjs'
      - 'scripts/check-v2-supabase-target.test.mjs'
      - 'scripts/check-v2-dependency-manifest.mjs'
      - '.github/workflows/v2-engineering.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-engineering-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  validation:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: npm install, tests, TypeScript and Expo bundles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile-v2
    env:
      # Public, deliberately nonfunctional CI values; no production credentials.
      EXPO_PUBLIC_SUPABASE_URL: https://xarhuczrtzuiljmtdaeu.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify V2 target isolation
        run: node ../../scripts/check-v2-supabase-target.mjs
      - name: Verify committed dependency lockfile contract
        run: node ../../scripts/check-v2-dependency-manifest.mjs --require-lockfile
      - name: Verify applied V2 migration provenance (static, no database)
        run: node ../../scripts/check-v2-applied-migration-integrity.mjs
      - name: Test migration integrity rejection cases
        run: node --test ../../scripts/check-v2-applied-migration-integrity.test.mjs
      - name: Validate signed founder iPhone build profiles (no credentials or build)
        run: |
          node ../../scripts/check-v2-founder-ios-build.mjs --config-only
          node --test ../../scripts/check-v2-founder-ios-build.test.mjs
      - name: Validate staging-only mobile project guard (no network or credentials)
        run: node --test src/lib/coachStagingBuildGuard.test.mjs
      - name: Clean dependency install
        run: npm ci --no-audit --no-fund
      - name: Test V2 source lint rejection cases
        run: node --test ../../scripts/lint-v2-source.test.mjs
      - name: Lint V2 client source (TypeScript AST security rules)
        run: npm run lint
      - name: Test Auth, Legal and Onboarding
        run: npm run test:auth
      - name: Test Cookbook nutrition
        run: npm run test:calculator
      - name: Test Training logic
        run: npm run test:training-logic
      - name: TypeScript correctness
        run: npm run typecheck
      - name: Expo config validation
        run: npx --no-install expo config --type public
      - name: Expo iOS JavaScript bundle
        run: npx --no-install expo export --platform ios --output-dir /tmp/allin365-v2-export-ios
      - name: Expo Android JavaScript bundle
        run: npx --no-install expo export --platform android --output-dir /tmp/allin365-v2-export-android
