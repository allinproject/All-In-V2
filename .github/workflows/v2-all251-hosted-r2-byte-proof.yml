name: ALL-251 protected R2 A/B bytes and synthetic fixture cleanup
# Not a release gate: this proves only hosted synthetic R2 bytes.
# Never dispatch until approved synthetic-only Worker is deployed with
# matching secret and isolated private R2 bucket.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: all251-protected-r2-byte-proof
  cancel-in-progress: false
jobs:
  protected-r2-bytes:
    if: github.ref == 'refs/heads/integration/v2-foundation'
    environment: all251-temporary-staging
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CI: 'true'
      ALL251_R2_HOSTED_OPERATOR_APPROVED: 'true'
      ALL251_STAGING_REF: fbtgknlxjyeqrxemskbl
      ALL251_STAGING_URL: https://fbtgknlxjyeqrxemskbl.supabase.co
      ALL251_R2_WORKER_URL: https://allin365-storage-staging.durbenventures.workers.dev
      ALL251_TEMP_STAGING_SECRET_KEY: ${{ secrets.ALL251_TEMP_STAGING_SECRET_KEY }}
      ALL251_TEMP_STAGING_PUBLISHABLE_KEY: ${{ vars.ALL251_TEMP_STAGING_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Validate protected staging scope and hosted byte proof runner
        run: |
          test "${ALL251_STAGING_REF}" = 'fbtgknlxjyeqrxemskbl'
          test -n "${ALL251_TEMP_STAGING_SECRET_KEY}"
          test -n "${ALL251_TEMP_STAGING_PUBLISHABLE_KEY}"
          node --check scripts/test-all251-hosted-r2-byte-proof.mjs
      - name: Real synthetic A/B R2 bytes and SHA-256
        run: node scripts/test-all251-hosted-r2-byte-proof.mjs
# Do not include the approved-once.txt marker in this review PR.
# It is a separate operator-gated launch after the Worker is ready.
