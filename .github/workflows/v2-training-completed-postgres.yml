name: V2 Training and Completed Activity identity PostgreSQL contract (no deploy)

on:
  push:
    branches: [integration/v2-foundation]
    paths:
      - 'docs/architecture/sql/V2-TRAINING-COMPLETED-IDENTITY-OWNER-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-INDOOR-WEEKLY-COMPETITION-OWNER-CANDIDATE.sql'
      - 'scripts/test-v2-training-completed-postgres.psql'
      - 'docs/architecture/sql/V2-TRAINING-SESSION-LIFECYCLE-WRITER-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-TRAINING-COMPLETION-ACK-CANDIDATE.sql'
      - 'scripts/test-v2-training-session-writer-postgres.psql'
      - '.github/workflows/v2-training-completed-postgres.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-training-completed-owner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-only:
    name: PostgreSQL 17 Training, Completed Activity and Competition owner replay
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: canonical_workout_contract
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d canonical_workout_contract"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGUSER: postgres
      PGDATABASE: canonical_workout_contract
    steps:
      - uses: actions/checkout@v4
      - name: Replay canonical workout owner proposal and cross-domain FKs
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG_CONTAINER" mkdir -p /tmp/allin/scripts /tmp/allin/docs/architecture/sql
          docker cp docs/architecture/sql/V2-TRAINING-COMPLETED-IDENTITY-OWNER-CANDIDATE.sql "$PG_CONTAINER:/tmp/allin/docs/architecture/sql/V2-TRAINING-COMPLETED-IDENTITY-OWNER-CANDIDATE.sql"
          docker cp docs/architecture/sql/V2-INDOOR-WEEKLY-COMPETITION-OWNER-CANDIDATE.sql "$PG_CONTAINER:/tmp/allin/docs/architecture/sql/V2-INDOOR-WEEKLY-COMPETITION-OWNER-CANDIDATE.sql"
          docker cp scripts/test-v2-training-completed-postgres.psql "$PG_CONTAINER:/tmp/allin/scripts/test-v2-training-completed-postgres.psql"
          docker exec "$PG_CONTAINER" psql -U "$PGUSER" -d "$PGDATABASE" -v ON_ERROR_STOP=1 -f /tmp/allin/scripts/test-v2-training-completed-postgres.psql
      - name: Replay lifecycle and outbox in an independent disposable DB
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG_CONTAINER" createdb -U "$PGUSER" session_writer_contract
          docker cp docs/architecture/sql/V2-TRAINING-SESSION-LIFECYCLE-WRITER-CANDIDATE.sql "$PG_CONTAINER:/tmp/allin/docs/architecture/sql/V2-TRAINING-SESSION-LIFECYCLE-WRITER-CANDIDATE.sql"
          docker cp docs/architecture/sql/V2-TRAINING-COMPLETION-ACK-CANDIDATE.sql "$PG_CONTAINER:/tmp/allin/docs/architecture/sql/V2-TRAINING-COMPLETION-ACK-CANDIDATE.sql"
          docker cp scripts/test-v2-training-session-writer-postgres.psql "$PG_CONTAINER:/tmp/allin/scripts/test-v2-training-session-writer-postgres.psql"
          docker exec "$PG_CONTAINER" psql -U "$PGUSER" -d session_writer_contract -v ON_ERROR_STOP=1 -f /tmp/allin/scripts/test-v2-training-session-writer-postgres.psql
