          docker exec "$PG_CONTAINER" psql -U "$PGUSER" -d training_complete_integration -v ON_ERROR_STOP=1 -f /tmp/allin/scripts/test-v2-training-two-connection-setup-postgres.psql
          docker exec "$PG_CONTAINER" psql -X -U "$PGUSER" -d training_complete_integration -v ON_ERROR_STOP=1 -c "SELECT public.v2_qa_start_race('aaaaaaa1-aaaa-4aaa-8aaa-aaaaaaaaaaaa','bbbbbbb1-bbbb-4bbb-8bbb-bbbbbbbbbbbb')" > /tmp/start-a.log 2>&1 &
          pid_a=$!
          docker exec "$PG_CONTAINER" psql -X -U "$PGUSER" -d training_complete_integration -v ON_ERROR_STOP=1 -c "SELECT public.v2_qa_start_race('aaaaaaa2-aaaa-4aaa-8aaa-aaaaaaaaaaaa','bbbbbbb2-bbbb-4bbb-8bbb-bbbbbbbbbbbb')" > /tmp/start-b.log 2>&1 &
          pid_b=$!
