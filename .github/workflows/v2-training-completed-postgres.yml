name: V2 Training and Completed Activity identity PostgreSQL contract (no deploy)

on:
  push:
    branches: [integration/v2-foundation]
    paths:
      - 'docs/architecture/sql/V2-TRAINING-COMPLETED-IDENTITY-OWNER-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-INDOOR-WEEKLY-COMPETITION-OWNER-CANDIDATE.sql'
      - 'scripts/test-v2-training-completed-postgres.psql'
      - 'docs/architecture/sql/V2-TRAINING-SESSION-LIFECYCLE-WRITER-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-TRAINING-COMPLETION-ACK-CANDIDATE.sql'
      - 'scripts/test-v2-training-session-writer-postgres.psql'
      - 'docs/architecture/sql/V2-TRAINING-AUTH-OWNER-GATEWAY-CANDIDATE.sql'
      - 'scripts/test-v2-training-auth-gateway-postgres.psql'
      - 'docs/architecture/sql/V2-TRAINING-PLAN-CALENDAR-OWNER-CANDIDATE.sql'
      - 'scripts/test-v2-training-plan-calendar-postgres.psql'
      - 'docs/architecture/sql/V2-COMPLETED-ACTIVITY-SOURCE-WRITER-CANDIDATE.sql'
      - 'scripts/test-v2-completed-source-writer-postgres.psql'
      - 'docs/architecture/sql/V2-TRAINING-PLAN-ACCEPTANCE-WRITER-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-TRAINING-IMMUTABLE-REVISION-GUARD-CANDIDATE.sql'
      - 'scripts/test-v2-training-plan-acceptance-postgres.psql'
      - 'docs/architecture/sql/V2-TRAINING-ACTIVITY-OUTBOX-WRITER-CANDIDATE.sql'
      - 'scripts/test-v2-training-activity-outbox-postgres.psql'
      - 'docs/architecture/sql/V2-TRAINING-START-PLANNED-WORKOUT-CANDIDATE.sql'
      - 'scripts/test-v2-training-start-planned-postgres.psql'
      - 'docs/architecture/sql/V2-COMPLETED-ACTIVITY-SCALAR-METRICS-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-COMPLETED-ACTIVITY-METRIC-DEFINITION-GUARD-CANDIDATE.sql'
      - 'scripts/test-v2-completed-scalar-metrics-postgres.psql'
      - 'docs/architecture/sql/V2-COMPLETED-ACTIVITY-SCALAR-READ-CANDIDATE.sql'
      - 'scripts/test-v2-completed-scalar-read-postgres.psql'
      - 'docs/architecture/sql/V2-COMPLETED-ACTIVITY-SEGMENTS-CANDIDATE.sql'
      - 'scripts/test-v2-completed-segments-postgres.psql'
      - '.github/workflows/v2-training-completed-postgres.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-training-completed-owner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-only:
    name: PostgreSQL 17 Training, Completed Activity and Competition owner replay
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: canonical_workout_contract
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d canonical_workout_contract"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGUSER: postgres
      PGDATABASE: canonical_workout_contract
    steps:
      - uses: actions/checkout@v4
      - name: Replay canonical workout owner proposal and cross-domain FKs
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG_CONTAINER" mkdir -p /tmp/allin/scripts /tmp/allin/docs/architecture/sql
          docker cp docs/architecture/sql/V2-TRAINING-COMPLETED-IDENTITY-OWNER-CANDIDATE.sql "$PG_CONTAINER:/tmp/allin/docs/architecture/sql/V2-TRAINING-COMPLETED-IDENTITY-OWNER-CANDIDATE.sql"
          docker cp docs/architecture/sql/V2-INDOOR-WEEKLY-COMPETITION-OWNER-CANDIDATE.sql "$PG_CONTAINER:/tmp/allin/docs/architecture/sql/V2-INDOOR-WEEKLY-COMPETITION-OWNER-CANDIDATE.sql"
          docker cp scripts/test-v2-training-completed-postgres.psql "$PG_CONTAINER:/tmp/allin/scripts/test-v2-training-completed-postgres.psql"
          docker exec "$PG_CONTAINER" psql -U "$PGUSER" -d "$PGDATABASE" -v ON_ERROR_STOP=1 -f /tmp/allin/scripts/test-v2-training-completed-postgres.psql
      - name: Replay lifecycle and outbox in an independent disposable DB
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG_CONTAINER" createdb -U "$PGUSER" session_writer_contract
          docker cp docs/architecture/sql/V2-TRAINING-SESSION-LIFECYCLE-WRITER-CANDIDATE.sql "$PG_CONTAINER:/tmp/allin/docs/architecture/sql/V2-TRAINING-SESSION-LIFECYCLE-WRITER-CANDIDATE.sql"
          docker cp docs/architecture/sql/V2-TRAINING-COMPLETION-ACK-CANDIDATE.sql "$PG_CONTAINER:/tmp/allin/docs/architecture/sql/V2-TRAINING-COMPLETION-ACK-CANDIDATE.sql"
          docker cp scripts/test-v2-training-session-writer-postgres.psql "$PG_CONTAINER:/tmp/allin/scripts/test-v2-training-session-writer-postgres.psql"
          docker exec "$PG_CONTAINER" psql -U "$PGUSER" -d session_writer_contract -v ON_ERROR_STOP=1 -f /tmp/allin/scripts/test-v2-training-session-writer-postgres.psql
      - name: Validate authenticated owner and session gateway in disposable DB
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG_CONTAINER" createdb -U "$PGUSER" auth_gateway_contract
          docker cp docs/architecture/sql/V2-TRAINING-AUTH-OWNER-GATEWAY-CANDIDATE.sql "$PG_CONTAINER:/tmp/allin/docs/architecture/sql/V2-TRAINING-AUTH-OWNER-GATEWAY-CANDIDATE.sql"
          docker cp scripts/test-v2-training-auth-gateway-postgres.psql "$PG_CONTAINER:/tmp/allin/scripts/test-v2-training-auth-gateway-postgres.psql"
          docker exec "$PG_CONTAINER" psql -U "$PGUSER" -d auth_gateway_contract -v ON_ERROR_STOP=1 -f /tmp/allin/scripts/test-v2-training-auth-gateway-postgres.psql
      - name: Replay canonical Training plan and calendar in disposable DB
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG_CONTAINER" createdb -U "$PGUSER" training_plan_calendar
          docker cp docs/architecture/sql/V2-TRAINING-PLAN-CALENDAR-OWNER-CANDIDATE.sql "$PG_CONTAINER:/tmp/allin/docs/architecture/sql/V2-TRAINING-PLAN-CALENDAR-OWNER-CANDIDATE.sql"
          docker cp scripts/test-v2-training-plan-calendar-postgres.psql "$PG_CONTAINER:/tmp/allin/scripts/test-v2-training-plan-calendar-postgres.psql"
          docker exec "$PG_CONTAINER" psql -U "$PGUSER" -d training_plan_calendar -v ON_ERROR_STOP=1 -f /tmp/allin/scripts/test-v2-training-plan-calendar-postgres.psql
      - name: Replay Completed Activity source identity and dedup in disposable DB
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG_CONTAINER" createdb -U "$PGUSER" completed_source_contract
          docker cp docs/architecture/sql/V2-COMPLETED-ACTIVITY-SOURCE-WRITER-CANDIDATE.sql "$PG_CONTAINER:/tmp/allin/docs/architecture/sql/V2-COMPLETED-ACTIVITY-SOURCE-WRITER-CANDIDATE.sql"
          docker cp scripts/test-v2-completed-source-writer-postgres.psql "$PG_CONTAINER:/tmp/allin/scripts/test-v2-completed-source-writer-postgres.psql"
          docker exec "$PG_CONTAINER" psql -U "$PGUSER" -d completed_source_contract -v ON_ERROR_STOP=1 -f /tmp/allin/scripts/test-v2-completed-source-writer-postgres.psql
      - name: Replay plan acceptance and immutable revision history in disposable DB
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG_CONTAINER" createdb -U "$PGUSER" training_plan_acceptance
          docker cp docs/architecture/sql/V2-TRAINING-PLAN-ACCEPTANCE-WRITER-CANDIDATE.sql "$PG_CONTAINER:/tmp/allin/docs/architecture/sql/V2-TRAINING-PLAN-ACCEPTANCE-WRITER-CANDIDATE.sql"
          docker cp docs/architecture/sql/V2-TRAINING-IMMUTABLE-REVISION-GUARD-CANDIDATE.sql "$PG_CONTAINER:/tmp/allin/docs/architecture/sql/V2-TRAINING-IMMUTABLE-REVISION-GUARD-CANDIDATE.sql"
          docker cp scripts/test-v2-training-plan-acceptance-postgres.psql "$PG_CONTAINER:/tmp/allin/scripts/test-v2-training-plan-acceptance-postgres.psql"
          docker exec "$PG_CONTAINER" psql -U "$PGUSER" -d training_plan_acceptance -v ON_ERROR_STOP=1 -f /tmp/allin/scripts/test-v2-training-plan-acceptance-postgres.psql
      - name: Replay source-backed one-activity handoff in disposable DB
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG_CONTAINER" createdb -U "$PGUSER" training_activity_outbox
          docker cp docs/architecture/sql/V2-TRAINING-ACTIVITY-OUTBOX-WRITER-CANDIDATE.sql "$PG_CONTAINER:/tmp/allin/docs/architecture/sql/V2-TRAINING-ACTIVITY-OUTBOX-WRITER-CANDIDATE.sql"
          docker cp scripts/test-v2-training-activity-outbox-postgres.psql "$PG_CONTAINER:/tmp/allin/scripts/test-v2-training-activity-outbox-postgres.psql"
          docker exec "$PG_CONTAINER" psql -U "$PGUSER" -d training_activity_outbox -v ON_ERROR_STOP=1 -f /tmp/allin/scripts/test-v2-training-activity-outbox-postgres.psql
      - name: Verify accepted scheduled workout starts with stable plan identity
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG_CONTAINER" createdb -U "$PGUSER" training_planned_start
          docker cp docs/architecture/sql/V2-TRAINING-START-PLANNED-WORKOUT-CANDIDATE.sql "$PG_CONTAINER:/tmp/allin/docs/architecture/sql/V2-TRAINING-START-PLANNED-WORKOUT-CANDIDATE.sql"
          docker cp scripts/test-v2-training-start-planned-postgres.psql "$PG_CONTAINER:/tmp/allin/scripts/test-v2-training-start-planned-postgres.psql"
          docker exec "$PG_CONTAINER" psql -U "$PGUSER" -d training_planned_start -v ON_ERROR_STOP=1 -f /tmp/allin/scripts/test-v2-training-start-planned-postgres.psql
      - name: Validate sourced metric registry and typed values in disposable DB
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG_CONTAINER" createdb -U "$PGUSER" completed_scalar_metrics
          docker cp docs/architecture/sql/V2-COMPLETED-ACTIVITY-SCALAR-METRICS-CANDIDATE.sql "$PG_CONTAINER:/tmp/allin/docs/architecture/sql/V2-COMPLETED-ACTIVITY-SCALAR-METRICS-CANDIDATE.sql"
          docker cp docs/architecture/sql/V2-COMPLETED-ACTIVITY-METRIC-DEFINITION-GUARD-CANDIDATE.sql "$PG_CONTAINER:/tmp/allin/docs/architecture/sql/V2-COMPLETED-ACTIVITY-METRIC-DEFINITION-GUARD-CANDIDATE.sql"
          docker cp scripts/test-v2-completed-scalar-metrics-postgres.psql "$PG_CONTAINER:/tmp/allin/scripts/test-v2-completed-scalar-metrics-postgres.psql"
          docker exec "$PG_CONTAINER" psql -U "$PGUSER" -d completed_scalar_metrics -v ON_ERROR_STOP=1 -f /tmp/allin/scripts/test-v2-completed-scalar-metrics-postgres.psql
      - name: Verify conservative Completed Activity source-consensus projection
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG_CONTAINER" createdb -U "$PGUSER" completed_scalar_read
          docker cp docs/architecture/sql/V2-COMPLETED-ACTIVITY-SEGMENTS-CANDIDATE.sql "$PG_CONTAINER:/tmp/allin/docs/architecture/sql/V2-COMPLETED-ACTIVITY-SEGMENTS-CANDIDATE.sql"
          docker cp docs/architecture/sql/V2-COMPLETED-ACTIVITY-SCALAR-READ-CANDIDATE.sql "$PG_CONTAINER:/tmp/allin/docs/architecture/sql/V2-COMPLETED-ACTIVITY-SCALAR-READ-CANDIDATE.sql"
          docker cp scripts/test-v2-completed-scalar-read-postgres.psql "$PG_CONTAINER:/tmp/allin/scripts/test-v2-completed-scalar-read-postgres.psql"
          docker exec "$PG_CONTAINER" psql -U "$PGUSER" -d completed_scalar_read -v ON_ERROR_STOP=1 -f /tmp/allin/scripts/test-v2-completed-scalar-read-postgres.psql
      - name: Verify nested segment and metric owner constraints
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG_CONTAINER" createdb -U "$PGUSER" completed_segments
          docker cp docs/architecture/sql/V2-COMPLETED-ACTIVITY-SEGMENTS-CANDIDATE.sql "$PG_CONTAINER:/tmp/allin/docs/architecture/sql/V2-COMPLETED-ACTIVITY-SEGMENTS-CANDIDATE.sql"
          docker cp scripts/test-v2-completed-segments-postgres.psql "$PG_CONTAINER:/tmp/allin/scripts/test-v2-completed-segments-postgres.psql"
          docker exec "$PG_CONTAINER" psql -U "$PGUSER" -d completed_segments -v ON_ERROR_STOP=1 -f /tmp/allin/scripts/test-v2-completed-segments-postgres.psql
