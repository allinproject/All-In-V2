  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-training-completed-owner-${{ github.ref }}
  # Keep a long, isolated foundation replay from being cancelled by unrelated pushes.
  cancel-in-progress: false

jobs:
  applied-foundation-source-integrity:
    name: V2 applied foundation migration hashes (no deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify immutable applied-migration source manifest and guard tests
        run: |
          node --test scripts/check-v2-applied-migration-integrity.test.mjs
          node scripts/check-v2-applied-migration-integrity.mjs
  full-applied-foundation-local-replay:
    name: Reapply deployed V2 foundation (isolated Supabase; no deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Local Docker only: don't inherit possible repository/environment credentials.
      SUPABASE_ACCESS_TOKEN: ''
      SUPABASE_DB_PASSWORD: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Determine whether a full local foundation replay is needed
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            enabled=true
          else
            # Fetch only the push base if the shallow checkout lacks it.
            # Fallback to running, never to incorrectly skipping validation.
            if [[ -n "$BEFORE_SHA" ]] && ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$BEFORE_SHA" >/dev/null 2>&1 || true
            fi
            if [[ -n "$BEFORE_SHA" ]] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
              changed="$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" -- supabase/migrations/ docs/architecture/sql/ scripts/test-v2-applied-foundation-local-postgres.psql scripts/test-v2-foundation-training-overlay-postgres.psql scripts/stage-v2-training-overlay.mjs scripts/stage-v2-training-overlay.test.mjs .github/workflows/v2-training-completed-postgres.yml)"
              if [[ -n "$changed" ]]; then enabled=true; else enabled=false; fi
            else
              enabled=true
            fi
          fi
          echo "run=$enabled" >> "$GITHUB_OUTPUT"
      - uses: supabase/setup-cli@v3
        if: steps.scope.outputs.run == 'true'
        with:
          # The local replay uses the v2 service/container contract.
          # Supabase CLI latest became v3 on 2026-11-02.
          version: v2.stable
      - name: Apply historical migrations to disposable LOCAL Supabase Postgres
        if: steps.scope.outputs.run == 'true'
        env:
          # Intentionally no SUPABASE_ACCESS_TOKEN, remote DB URL, or secrets.
          # Never use --remote/--linked/db push in this acceptance job.
          CI: '1'
        shell: bash
        run: |
          set -euo pipefail
          cli_version="$(supabase --version)"
          echo "Supabase local replay CLI: $cli_version"
          case "$cli_version" in
            2.*) ;;
            *) echo 'Expected Supabase CLI v2 local replay contract'; exit 1 ;;
          esac
          node scripts/check-v2-applied-migration-integrity.mjs
          # Start only the local stack and force a clean, deterministic
          # replay. Do not depend on db start to apply pending migrations.
          supabase start -x studio,imgproxy,mailpit,logflare,vector,supavisor
          supabase db reset --local --no-seed
          container="$(docker ps --filter name=supabase_db_ --format '{{.ID}}' | head -n 1)"
          test -n "$container" || { echo 'Missing isolated Supabase PostgreSQL container'; exit 1; }
          docker cp scripts/test-v2-applied-foundation-local-postgres.psql "$container:/tmp/test-v2-applied-foundation-local-postgres.psql"
          docker exec "$container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/test-v2-applied-foundation-local-postgres.psql
          # This phase is intentionally transactional: DDL rolls back.
          # Copy existing candidate definitions rather than maintaining
          # a competing migration schema or creating a remote database.
          node --test scripts/stage-v2-training-overlay.test.mjs
          node scripts/stage-v2-training-overlay.mjs /tmp/allin-v2-training-overlay-sql
          docker exec "$container" mkdir -p /tmp/allin/docs/architecture
          docker cp /tmp/allin-v2-training-overlay-sql "$container:/tmp/allin/docs/architecture/sql"
          docker cp scripts/test-v2-foundation-training-overlay-postgres.psql "$container:/tmp/test-v2-foundation-training-overlay-postgres.psql"
          docker exec "$container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/test-v2-foundation-training-overlay-postgres.psql
      - name: Stop isolated Supabase database
        if: always() && steps.scope.outputs.run == 'true'
        run: supabase stop --no-backup || true

  device-ingest-two-owner:
    name: ALL-243 two-athlete private ingest RLS (isolated PG17)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: device_ingest_rls
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d device_ingest_rls"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Execute real two-owner PostgreSQL permissions and nonce replay
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec "$PG_CONTAINER" mkdir -p /tmp/allin/scripts /tmp/allin/docs/architecture/sql
          for f in V2-TRAINING-COMPLETED-IDENTITY-OWNER-CANDIDATE.sql V2-COMPLETED-ACTIVITY-SCALAR-METRICS-CANDIDATE.sql V2-COMPLETED-ACTIVITY-METRIC-DEFINITION-GUARD-CANDIDATE.sql V2-COMPLETED-ACTIVITY-PRIVATE-INGEST-GATEWAY-CANDIDATE.sql V2-COMPLETED-ACTIVITY-SCALAR-READ-CANDIDATE.sql; do
            docker cp "docs/architecture/sql/$f" "$PG_CONTAINER:/tmp/allin/docs/architecture/sql/$f"
          done
          for f in test-v2-completed-scalar-metrics-postgres.psql test-v2-device-ingest-two-owner-postgres.psql; do
            docker cp "scripts/$f" "$PG_CONTAINER:/tmp/allin/scripts/$f"
          done
          docker exec "$PG_CONTAINER" psql -U postgres -d device_ingest_rls -v ON_ERROR_STOP=1 -f /tmp/allin/scripts/test-v2-device-ingest-two-owner-postgres.psql
      - name: Race device metric ingest against activity invalidation and rejected source
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          bash scripts/test-v2-device-ingest-invalidation-race.sh

  device-ingest-operator-postgres:
    name: ALL-243 trusted operator, live Auth rows, device registry (PG17)
    runs-on: ubuntu-latest
    timeout-minutes: 9
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: device_ingest_operator
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d device_ingest_operator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Execute trusted operator Auth and canonical PostgreSQL acceptance
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec "$PG_CONTAINER" mkdir -p /tmp/allin/scripts /tmp/allin/docs/architecture/sql
          for f in V2-TRAINING-COMPLETED-IDENTITY-OWNER-CANDIDATE.sql V2-COMPLETED-ACTIVITY-SCALAR-METRICS-CANDIDATE.sql V2-COMPLETED-ACTIVITY-METRIC-DEFINITION-GUARD-CANDIDATE.sql V2-COMPLETED-ACTIVITY-PRIVATE-INGEST-GATEWAY-CANDIDATE.sql V2-COMPLETED-ACTIVITY-DEVICE-REGISTRATION-CANDIDATE.sql V2-COMPLETED-ACTIVITY-DEVICE-OPERATOR-CANDIDATE.sql; do
            docker cp "docs/architecture/sql/$f" "$PG_CONTAINER:/tmp/allin/docs/architecture/sql/$f"
          done
          for f in test-v2-completed-scalar-metrics-postgres.psql test-v2-device-ingest-two-owner-postgres.psql test-v2-device-ingest-operator-postgres.psql; do
            docker cp "scripts/$f" "$PG_CONTAINER:/tmp/allin/scripts/$f"
          done
          docker exec "$PG_CONTAINER" psql -X -U postgres -d device_ingest_operator -v ON_ERROR_STOP=1 -f /tmp/allin/scripts/test-v2-device-ingest-two-owner-postgres.psql
          docker exec "$PG_CONTAINER" psql -X -U postgres -d device_ingest_operator -v ON_ERROR_STOP=1 -f /tmp/allin/scripts/test-v2-device-ingest-operator-postgres.psql
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify staged Edge Function and execute actual Deno/PostgreSQL adapter transaction
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
          ALLIN_PG_TEST_URL: postgres://allin_v2_ingest_operator:isolated_fixture_password@127.0.0.1:5432/device_ingest_operator
          ALLIN_PG_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/device_ingest_operator
        run: |
          set -euo pipefail
          docker exec "$PG_CONTAINER" psql -X -U postgres -d device_ingest_operator -v ON_ERROR_STOP=1 -c "ALTER ROLE allin_v2_ingest_operator PASSWORD 'isolated_fixture_password'"
          docker exec "$PG_CONTAINER" psql -X -U postgres -d device_ingest_operator -v ON_ERROR_STOP=1 -c "UPDATE auth.sessions SET not_after=now()+interval '1 day' WHERE id='11111111-aaaa-4aaa-8aaa-aaaaaaaaaaaa'; UPDATE allin_private.v2_device_registrations_candidate SET revoked_at=NULL WHERE device_ref='paired-trainer-42'"
          docker exec "$PG_CONTAINER" psql -X -U postgres -d device_ingest_operator -v ON_ERROR_STOP=1 -c "INSERT INTO public.v2_activity_metric_definitions(metric_code,definition_version,display_name,canonical_unit,value_kind,sport_scope,measurement_kinds,display_group,privacy_class,status) VALUES ('ingest_runtime_metric',1,'Runtime metric','units','numeric',ARRAY['cycling'],ARRAY['source_measured'],'other','private','published')"
          deno check supabase/functions/v2-device-ingest/index.ts
          deno check supabase/functions/v2-device-pairing/index.ts
          deno test --allow-env --allow-net supabase/functions/_shared/appleAppAttestEnrollmentVerifier.test.ts
          deno test --allow-env --allow-net supabase/functions/_shared/appleAppAttestReceiptVerifier.test.ts
          deno test --allow-env --allow-net scripts/test-v2-device-ingest-postgres-runtime.ts
      - name: Validate restricted device pairing and revocation in disposable PostgreSQL
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker cp docs/architecture/sql/V2-COMPLETED-ACTIVITY-DEVICE-PAIRING-WRITER-CANDIDATE.sql "$PG_CONTAINER:/tmp/allin/docs/architecture/sql/V2-COMPLETED-ACTIVITY-DEVICE-PAIRING-WRITER-CANDIDATE.sql"
          docker cp scripts/test-v2-device-pairing-postgres.psql "$PG_CONTAINER:/tmp/allin/scripts/test-v2-device-pairing-postgres.psql"
          docker exec "$PG_CONTAINER" psql -X -U postgres -d device_ingest_operator -v ON_ERROR_STOP=1 -c "UPDATE auth.sessions SET not_after=now()+interval '1 day' WHERE id='11111111-aaaa-4aaa-8aaa-aaaaaaaaaaaa'"
          docker exec "$PG_CONTAINER" psql -X -U postgres -d device_ingest_operator -v ON_ERROR_STOP=1 -f /tmp/allin/scripts/test-v2-device-pairing-postgres.psql
          docker cp docs/architecture/sql/V2-APPLE-ATTESTED-COMPANION-KEYS-CANDIDATE.sql "$PG_CONTAINER:/tmp/allin/docs/architecture/sql/V2-APPLE-ATTESTED-COMPANION-KEYS-CANDIDATE.sql"
          docker exec "$PG_CONTAINER" psql -X -U postgres -d device_ingest_operator -v ON_ERROR_STOP=1 -f /tmp/allin/docs/architecture/sql/V2-APPLE-ATTESTED-COMPANION-KEYS-CANDIDATE.sql
          docker cp scripts/test-v2-apple-attested-phone-trust-postgres.psql "$PG_CONTAINER:/tmp/allin/scripts/test-v2-apple-attested-phone-trust-postgres.psql"
          docker exec "$PG_CONTAINER" psql -X -U postgres -d device_ingest_operator -v ON_ERROR_STOP=1 -f /tmp/allin/scripts/test-v2-apple-attested-phone-trust-postgres.psql
          docker cp scripts/test-v2-appattest-enrollment-postgres.psql "$PG_CONTAINER:/tmp/allin/scripts/test-v2-appattest-enrollment-postgres.psql"
          docker exec "$PG_CONTAINER" psql -X -U postgres -d device_ingest_operator -v ON_ERROR_STOP=1 -f /tmp/allin/scripts/test-v2-appattest-enrollment-postgres.psql
          docker exec "$PG_CONTAINER" psql -X -U postgres -d device_ingest_operator -v ON_ERROR_STOP=1 -c "ALTER ROLE allin_v2_appattest_enrollment_operator PASSWORD 'isolated_appattest_password'"

      - name: Run actual trusted pairing adapter through dedicated DB role
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
          ALLIN_PAIRING_TEST_URL: postgres://allin_v2_device_registrar:isolated_pairing_password@127.0.0.1:5432/device_ingest_operator
          ALLIN_PG_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/device_ingest_operator
        run: |
          set -euo pipefail
          docker exec "$PG_CONTAINER" psql -X -U postgres -d device_ingest_operator -v ON_ERROR_STOP=1 -c "ALTER ROLE allin_v2_device_registrar PASSWORD 'isolated_pairing_password'"
          deno test --allow-env --allow-net scripts/test-v2-device-pairing-postgres-runtime.ts
          deno test --allow-env --allow-net scripts/test-v2-apple-watch-ownership-runtime.ts
