name: V2 Training and Completed Activity review migration parity (no deploy)
on:
  pull_request:
    paths:
      - 'supabase/migrations/2026111303550*_v2_*_review.sql'
      - 'scripts/test-v2-training-activity-migration-parity.mjs'
      - 'scripts/test-v2-training-activity-two-owner-local.psql'
      - 'docs/architecture/sql/V2-*-CANDIDATE.sql'
      - '.github/workflows/v2-training-activity-migration-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-parity:
    name: Exact canonical SQL source parity (no database)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify ordered review migrations exactly match canonical candidate SQL
        run: node --test scripts/test-v2-training-activity-migration-parity.mjs

  local-supabase-migration-replay:
    name: Apply five review migrations to disposable local Supabase (no deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      SUPABASE_ACCESS_TOKEN: ''
      SUPABASE_DB_PASSWORD: ''
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: v2.stable
      - name: Bootstrap and apply all migrations to isolated local Supabase
        shell: bash
        run: |
          set -euo pipefail
          case "$(supabase --version)" in 2.*) ;; *) exit 1 ;; esac
          node scripts/check-v2-applied-migration-integrity.mjs
          # Isolate local Supabase from other runner services using default 5432x ports.
          printf '\n[api]\nport = 55421\n[db]\nport = 55422\nshadow_port = 55420\n' >> supabase/config.toml
          supabase start -x studio,imgproxy,mailpit,logflare,vector,supavisor
          supabase db reset --local --no-seed
          container="$(docker ps --filter name=supabase_db_ --format '{{.ID}}' | head -n 1)"
          test -n "$container"
          docker exec "$container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "
            DO \$assert\$
            BEGIN
              IF pg_catalog.to_regclass('public.v2_training_plans') IS NULL
                OR pg_catalog.to_regclass('public.v2_completed_activities') IS NULL
                OR pg_catalog.to_regclass('public.v2_activity_metric_values') IS NULL
                OR pg_catalog.to_regclass('public.v2_activity_segments') IS NULL
                OR pg_catalog.to_regprocedure('public.v2_training_day_read_candidate(uuid,date)') IS NULL
                OR pg_catalog.to_regprocedure('public.v2_completed_activity_detail_candidate(uuid,uuid)') IS NULL
              THEN RAISE EXCEPTION 'Expected canonical owner schema/reader missing'; END IF;
              IF EXISTS (
                SELECT 1 FROM pg_catalog.pg_class c
                JOIN pg_catalog.pg_namespace n ON n.oid=c.relnamespace
                WHERE n.nspname='public' AND c.relname IN (
                  'v2_training_plans','v2_completed_activities',
                  'v2_activity_metric_values','v2_activity_segments')
                  AND NOT c.relrowsecurity
              ) THEN RAISE EXCEPTION 'Canonical owner RLS disabled'; END IF;
              IF pg_catalog.has_function_privilege('anon','public.v2_training_day_read_candidate(uuid,date)','EXECUTE')
                OR pg_catalog.has_function_privilege('authenticated','public.v2_training_day_read_candidate(uuid,date)','EXECUTE')
                OR pg_catalog.has_function_privilege('anon','public.v2_completed_activity_detail_candidate(uuid,uuid)','EXECUTE')
                OR pg_catalog.has_function_privilege('authenticated','public.v2_completed_activity_detail_candidate(uuid,uuid)','EXECUTE')
              THEN RAISE EXCEPTION 'Review-only reader prematurely executable by client'; END IF;
              RAISE NOTICE 'PASS ALL-222/243/246: actual versioned migration schema, RLS and denied client reader grants';
            END \$assert\$;"
          docker exec "$container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -Atc "
            SELECT count(*) FROM supabase_migrations.schema_migrations
            WHERE version IN ('20261113035500','20261113035501','20261113035502',
              '20261113035503','20261113035504');" | grep -qx '5'
      - name: Audit entire canonical graph and ALL-251 account lifecycle gates
        shell: bash
        run: |
          set -euo pipefail
          container="$(docker ps --filter name=supabase_db_ --format '{{.ID}}' | head -n 1)"
          test -n "$container"
          docker exec -i "$container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $audit$
          DECLARE
            row record;
            total_tables integer := 0;
            total_functions integer := 0;
          BEGIN
            FOR row IN
              SELECT c.oid, n.nspname, c.relname, c.relrowsecurity
              FROM pg_catalog.pg_class c
              JOIN pg_catalog.pg_namespace n ON n.oid = c.relnamespace
              WHERE c.relkind IN ('r','p')
                AND n.nspname IN ('public','allin_private')
                AND (c.relname LIKE 'v2_training%' OR
                     c.relname LIKE 'v2_completed%' OR
                     c.relname LIKE 'v2_activity_%' OR
                     c.relname LIKE 'v2_indoor_weekly%')
            LOOP
              total_tables := total_tables + 1;
              IF NOT row.relrowsecurity OR
                 pg_catalog.has_table_privilege('anon',row.oid,'SELECT,INSERT,UPDATE,DELETE') OR
                 pg_catalog.has_table_privilege('authenticated',row.oid,'SELECT,INSERT,UPDATE,DELETE')
              THEN
                RAISE EXCEPTION 'Unapproved table RLS/grant: %.%',row.nspname,row.relname;
              END IF;
            END LOOP;
            FOR row IN
              SELECT p.oid,n.nspname,p.proname
              FROM pg_catalog.pg_proc p
              JOIN pg_catalog.pg_namespace n ON n.oid=p.pronamespace
              WHERE n.nspname IN ('public','allin_private')
                AND (p.proname LIKE 'v2_training%' OR
                     p.proname LIKE 'v2_completed%' OR
                     p.proname LIKE 'v2_activity_%' OR
                     p.proname LIKE 'v2_indoor_weekly%')
            LOOP
              total_functions := total_functions + 1;
              IF pg_catalog.has_function_privilege('anon',row.oid,'EXECUTE') OR
                 pg_catalog.has_function_privilege('authenticated',row.oid,'EXECUTE')
              THEN
                RAISE EXCEPTION 'Unapproved function grant: %.%',row.nspname,row.proname;
              END IF;
            END LOOP;
            IF total_tables < 15 OR total_functions < 5 THEN
              RAISE EXCEPTION 'Incomplete canonical owner graph: % tables, % functions',total_tables,total_functions;
            END IF;
            IF pg_catalog.to_regprocedure('public.v2_export_my_account_snapshot(uuid)') IS NULL
               OR pg_catalog.to_regprocedure('allin_private.v2_training_account_export_fragment_candidate(uuid)') IS NULL
               OR NOT pg_catalog.has_function_privilege('authenticated','public.v2_export_my_account_snapshot(uuid)','EXECUTE')
               OR pg_catalog.has_function_privilege('anon','public.v2_export_my_account_snapshot(uuid)','EXECUTE')
            THEN
              RAISE EXCEPTION 'ALL-251 export integration missing or public export grant changed';
            END IF;
            IF EXISTS (
              SELECT 1
              FROM pg_catalog.pg_class c
              JOIN pg_catalog.pg_namespace n ON n.oid=c.relnamespace
              JOIN pg_catalog.pg_attribute a ON a.attrelid=c.oid AND a.attname='user_id'
              WHERE c.relkind='r' AND n.nspname IN ('public','allin_private')
                AND (c.relname LIKE 'v2_training%' OR c.relname LIKE 'v2_completed%'
                     OR c.relname LIKE 'v2_activity_%' OR c.relname LIKE 'v2_indoor_weekly%')
                AND NOT EXISTS (
                  SELECT 1 FROM pg_catalog.pg_constraint con
                  WHERE con.conrelid=c.oid AND con.contype='f'
                    AND con.confrelid='auth.users'::pg_catalog.regclass
                    AND con.confdeltype='c'
                    AND a.attnum=ANY(con.conkey)
                )
            ) THEN
              RAISE EXCEPTION 'ALL-251 direct owner Auth cascade missing';
            END IF;
            RAISE NOTICE 'PASS release review: % RLS owner tables, % denied client functions, export and Auth cascade gates',total_tables,total_functions;
          END $audit$;
          SQL
      - name: Exercise both authenticated owner readers with populated two-athlete fixtures
        shell: bash
        run: |
          set -euo pipefail
          container="$(docker ps --filter name=supabase_db_ --format '{{.ID}}' | head -n 1)"
          test -n "$container"
          docker cp scripts/test-v2-training-activity-two-owner-local.psql "$container:/tmp/test-v2-training-activity-two-owner-local.psql"
          docker exec "$container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/test-v2-training-activity-two-owner-local.psql
      - name: Stop disposable database
        if: always()
        run: supabase stop --no-backup || true
