name: ALL-247 prepare native crypto dependency review (one shot)

on:
  push:
    branches:
      - integration/v2-foundation
    paths:
      - '.github/workflows/all247-native-crypto-dependency-review.yml'

permissions:
  contents: write

jobs:
  prepare-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install supported Expo dependency and prepare coherent lockfile
        working-directory: apps/mobile-v2
        run: |
          set -euo pipefail
          npm install 'expo-crypto@~58.0.8' --package-lock-only --ignore-scripts --no-audit --no-fund
          node - <<'NODE'
          const fs=require('node:fs');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          if(pkg.dependencies['expo-crypto']!=='~58.0.8') throw Error('Unexpected package version');
          if(lock.packages[''].dependencies['expo-crypto']!=='~58.0.8') throw Error('Lock root mismatch');
          if(lock.packages['node_modules/expo-crypto']?.version!=='58.0.8') throw Error('Unexpected locked expo-crypto');
          NODE
          npm ci --dry-run --ignore-scripts --no-audit --no-fund
      - name: Publish dependency change to isolated review branch only
        env:
          REVIEW_BRANCH: review/all247-secure-entropy-dependency-20261112
        run: |
          set -euo pipefail
          git diff --exit-code -- apps/mobile-v2/package.json apps/mobile-v2/package-lock.json && {
            echo 'No dependency change was generated'; exit 1;
          } || true
          unexpected="$(git diff --name-only | grep -v -E '^apps/mobile-v2/(package\.json|package-lock\.json)$' || true)"
          if test -n "$unexpected"; then echo 'Unexpected files changed'; exit 1; fi
          if git ls-remote --heads origin "$REVIEW_BRANCH" | grep -q .; then
            echo 'Review branch already exists; refusing overwrite'; exit 1;
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$REVIEW_BRANCH"
          git add apps/mobile-v2/package.json apps/mobile-v2/package-lock.json
          git commit -m 'build(ALL-247): prepare Expo SDK 58 crypto dependency and lockfile'
          git push origin "HEAD:refs/heads/$REVIEW_BRANCH"
          echo "Prepared review branch: $REVIEW_BRANCH"
