name: V2 foundation clean Supabase replay (manual, local only)

on:
  push:
    branches: [integration/v2-foundation]
    paths:
      - '.github/workflows/v2-foundation-clean-replay.yml'
      - 'scripts/test-v2-applied-foundation-local-postgres.psql'
      - 'docs/architecture/sql/V2-TRAINING-COMPLETED-IDENTITY-OWNER-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-TRAINING-PLAN-CALENDAR-OWNER-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-TRAINING-IMMUTABLE-REVISION-GUARD-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-TRAINING-PLAN-ACCEPTANCE-WRITER-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-TRAINING-SESSION-LIFECYCLE-WRITER-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-TRAINING-AUTH-OWNER-GATEWAY-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-COMPLETED-ACTIVITY-SOURCE-WRITER-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-COMPLETED-ACTIVITY-SCALAR-METRICS-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-COMPLETED-ACTIVITY-METRIC-DEFINITION-GUARD-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-COMPLETED-ACTIVITY-SEGMENTS-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-COMPLETED-ACTIVITY-STRENGTH-SETS-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-COMPLETED-ACTIVITY-SCALAR-READ-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-TRAINING-COMPLETION-ACK-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-TRAINING-ACTIVITY-OUTBOX-WRITER-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-TRAINING-START-PLANNED-WORKOUT-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-INDOOR-WEEKLY-COMPETITION-OWNER-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-INDOOR-WEEKLY-SCORE-V1-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-COMPLETED-ACTIVITY-EVIDENCE-OBJECTS-CANDIDATE.sql'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-foundation-clean-replay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  clean-foundation:
    name: Clean local Supabase Auth/Storage/pg_cron foundation replay
    if: github.ref == 'refs/heads/integration/v2-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Deliberately no Supabase access token, remote DB URL or deployment key.
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Verify applied foundation SQL has not drifted
        run: |
          node --test scripts/check-v2-applied-migration-integrity.test.mjs
          node scripts/check-v2-applied-migration-integrity.mjs
      - name: Boot isolated local Supabase services
        run: supabase start
      - name: Reset local-only foundation and replay every committed migration
        run: supabase db reset --local --no-seed
      - name: Verify local foundation objects, permissions and migration count
        run: |
          # Local CLI only. Do not use --remote, --linked, --db-url or db push.
          supabase migration list --local
          supabase status
      - name: Verify real foundation SQL/RLS/cron in the local Postgres container
        run: |
          set -euo pipefail
          db_container="$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n 1)"
          test -n "$db_container"
          docker cp scripts/test-v2-applied-foundation-local-postgres.psql "$db_container:/tmp/v2-foundation-qa.psql"
          docker exec "$db_container" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/v2-foundation-qa.psql
      - name: Check foundation-to-canonical schema compatibility in disposable DB
        run: |
          set -euo pipefail
          # The real foundation is already applied. These remain review-only
          # candidate sources, loaded solely into the local ephemeral DB.
          db_container="$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n 1)"
          test -n "$db_container"
          for file in \
            docs/architecture/sql/V2-TRAINING-COMPLETED-IDENTITY-OWNER-CANDIDATE.sql \
            docs/architecture/sql/V2-TRAINING-PLAN-CALENDAR-OWNER-CANDIDATE.sql; do
            docker cp "$file" "$db_container:/tmp/$(basename "$file")"
            docker exec "$db_container" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -f "/tmp/$(basename "$file")"
          done
          docker exec -i "$db_container" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $check$
          BEGIN
            IF to_regclass('public.v2_training_plans') IS NULL
               OR to_regclass('public.v2_completed_activities') IS NULL
               OR to_regclass('public.v2_training_revision_sessions') IS NULL
            THEN RAISE EXCEPTION 'Training/Activity candidate objects absent'; END IF;
            IF EXISTS (
              SELECT 1 FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
              WHERE n.nspname='public' AND c.relname IN
                ('v2_training_plans','v2_completed_activities','v2_training_revision_sessions')
                AND NOT c.relrowsecurity
            ) THEN RAISE EXCEPTION 'Training/Activity RLS disabled'; END IF;
            IF has_table_privilege('authenticated','public.v2_training_plans','INSERT')
               OR has_table_privilege('anon','public.v2_completed_activities','SELECT')
            THEN RAISE EXCEPTION 'Unreviewed candidate client grants'; END IF;
            RAISE NOTICE 'PASS: 18 real foundation migrations + owner identity/calendar DDL';
          END $check$;
          SQL
      - name: Replay full canonical Training and Completed Activity candidate graph
        run: |
          set -euo pipefail
          # Review-only DDL on a disposable Supabase local DB, never a remote target.
          db_container="$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n 1)"
          test -n "$db_container"
          for file in \
            docs/architecture/sql/V2-TRAINING-IMMUTABLE-REVISION-GUARD-CANDIDATE.sql \
            docs/architecture/sql/V2-TRAINING-PLAN-ACCEPTANCE-WRITER-CANDIDATE.sql \
            docs/architecture/sql/V2-TRAINING-SESSION-LIFECYCLE-WRITER-CANDIDATE.sql \
            docs/architecture/sql/V2-TRAINING-AUTH-OWNER-GATEWAY-CANDIDATE.sql \
            docs/architecture/sql/V2-COMPLETED-ACTIVITY-SOURCE-WRITER-CANDIDATE.sql \
            docs/architecture/sql/V2-COMPLETED-ACTIVITY-SCALAR-METRICS-CANDIDATE.sql \
            docs/architecture/sql/V2-COMPLETED-ACTIVITY-METRIC-DEFINITION-GUARD-CANDIDATE.sql \
            docs/architecture/sql/V2-COMPLETED-ACTIVITY-SEGMENTS-CANDIDATE.sql \
            docs/architecture/sql/V2-COMPLETED-ACTIVITY-STRENGTH-SETS-CANDIDATE.sql \
            docs/architecture/sql/V2-COMPLETED-ACTIVITY-SCALAR-READ-CANDIDATE.sql \
            docs/architecture/sql/V2-TRAINING-COMPLETION-ACK-CANDIDATE.sql \
            docs/architecture/sql/V2-TRAINING-ACTIVITY-OUTBOX-WRITER-CANDIDATE.sql \
            docs/architecture/sql/V2-TRAINING-START-PLANNED-WORKOUT-CANDIDATE.sql \
            docs/architecture/sql/V2-INDOOR-WEEKLY-COMPETITION-OWNER-CANDIDATE.sql \
            docs/architecture/sql/V2-INDOOR-WEEKLY-SCORE-V1-CANDIDATE.sql \
            docs/architecture/sql/V2-COMPLETED-ACTIVITY-EVIDENCE-OBJECTS-CANDIDATE.sql; do
            docker cp "$file" "$db_container:/tmp/$(basename "$file")"
            docker exec "$db_container" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -f "/tmp/$(basename "$file")"
          done
          docker exec -i "$db_container" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $gate$
          DECLARE
            v_count integer;
          BEGIN
            SELECT count(*) INTO v_count
            FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
            WHERE n.nspname IN ('public','allin_private')
              AND (c.relname LIKE 'v2_training_%'
                   OR c.relname='v2_completed_activities'
                   OR c.relname LIKE 'v2_activity_%'
                   OR c.relname LIKE 'v2_indoor_weekly_%')
              AND c.relkind IN ('r','p');
            IF v_count < 15 THEN
              RAISE EXCEPTION 'Canonical candidate graph incomplete: % tables',v_count;
            END IF;
            IF EXISTS(
              SELECT 1 FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
              WHERE n.nspname IN ('public','allin_private')
                AND (c.relname LIKE 'v2_training_%'
                     OR c.relname='v2_completed_activities'
                     OR c.relname LIKE 'v2_activity_%'
                     OR c.relname LIKE 'v2_indoor_weekly_%')
                AND c.relkind IN ('r','p') AND NOT c.relrowsecurity
            ) THEN RAISE EXCEPTION 'Candidate table with RLS disabled'; END IF;
            IF EXISTS(
              SELECT 1 FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
              WHERE n.nspname IN ('public','allin_private')
                AND (c.relname LIKE 'v2_training_%'
                     OR c.relname='v2_completed_activities'
                     OR c.relname LIKE 'v2_activity_%'
                     OR c.relname LIKE 'v2_indoor_weekly_%')
                AND c.relkind IN ('r','p')
                AND (has_table_privilege('anon',c.oid,'INSERT,UPDATE,DELETE')
                     OR has_table_privilege('authenticated',c.oid,'INSERT,UPDATE,DELETE'))
            ) THEN RAISE EXCEPTION 'Unsafe candidate direct client write grants'; END IF;
            IF NOT EXISTS(SELECT 1 FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace
                WHERE n.nspname='allin_private'
                  AND p.proname='v2_training_create_activity_from_outbox_candidate')
            THEN RAISE EXCEPTION 'Training-to-Activity outbox writer absent'; END IF;
            RAISE NOTICE 'PASS: full canonical candidate graph on real local 18-migration Supabase foundation';
          END $gate$;
          SQL
      - name: Stop local Supabase services
        if: always()
        run: supabase stop --no-backup
