name: V2 foundation clean Supabase replay (manual, local only)

on:
  push:
    branches: [integration/v2-foundation]
    paths:
      - '.github/workflows/v2-foundation-clean-replay.yml'
      - 'docs/architecture/sql/V2-GOALS-IDENTITY-REVISION-OWNER-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-GOALS-REVISION-HISTORY-GUARD-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-GOALS-REVISION-ACCEPTANCE-WRITER-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-GOALS-OWNER-SNAPSHOT-READER-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-GOALS-BEHAVIOR-TARGET-OWNER-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-GOALS-DURABLE-REVIEW-GATE-CANDIDATE.sql'
      - 'scripts/test-v2-goals-durable-review-local-postgres.psql'
      - 'scripts/test-v2-goals-behavior-local-postgres.psql'
      - 'scripts/test-v2-goals-owner-snapshot-local-postgres.psql'
      - 'scripts/test-v2-goals-acceptance-local-postgres.psql'
      - 'scripts/test-v2-goals-acceptance-race-local.sh'
      - 'scripts/test-v2-goals-owner-local-postgres.psql'
      - 'scripts/test-v2-applied-foundation-local-postgres.psql'
      - 'scripts/test-v2-billing-local-foundation.psql'
      - 'scripts/test-v2-billing-backup-seed-local.psql'
      - 'scripts/test-v2-billing-backup-restored-local.psql'
      - 'scripts/test-v2-billing-preupgrade-seed.psql'
      - 'scripts/test-v2-billing-schema-rollback-local.psql'
      - 'docs/architecture/sql/V2-SUBSCRIPTION-VERIFIED-LEDGER-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-SUBSCRIPTION-SERVICE-GRANTS-CANDIDATE.sql'
      - 'scripts/test-v2-training-local-populated-owner-deletion.psql'
      - 'scripts/test-v2-training-local-role-boundaries.psql'
      - 'docs/architecture/sql/V2-TRAINING-COMPLETED-IDENTITY-OWNER-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-TRAINING-PLAN-CALENDAR-OWNER-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-TRAINING-ACTIVITY-OWNER-CASCADE-REVIEW-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-TRAINING-ACCOUNT-DELETION-HISTORY-GUARD-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-TRAINING-DIRECT-AUTH-CASCADE-REVIEW-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-TRAINING-ACCOUNT-EXPORT-FRAGMENT-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-ACCOUNT-EXPORT-TRAINING-INTEGRATION-REVIEW-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-TRAINING-IMMUTABLE-REVISION-GUARD-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-TRAINING-PLAN-ACCEPTANCE-WRITER-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-TRAINING-SESSION-LIFECYCLE-WRITER-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-TRAINING-AUTH-OWNER-GATEWAY-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-COMPLETED-ACTIVITY-SOURCE-WRITER-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-COMPLETED-ACTIVITY-SCALAR-METRICS-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-COMPLETED-ACTIVITY-METRIC-DEFINITION-GUARD-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-COMPLETED-ACTIVITY-SEGMENTS-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-COMPLETED-ACTIVITY-STRENGTH-SETS-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-COMPLETED-ACTIVITY-SCALAR-READ-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-TRAINING-COMPLETION-ACK-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-TRAINING-ACTIVITY-OUTBOX-WRITER-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-TRAINING-START-PLANNED-WORKOUT-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-INDOOR-WEEKLY-COMPETITION-OWNER-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-INDOOR-WEEKLY-SCORE-V1-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-COMPLETED-ACTIVITY-EVIDENCE-OBJECTS-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-COACH-PERSISTENCE-CANDIDATE.sql'
      - 'docs/architecture/sql/V2-COACH-PERSISTENCE-SECURITY-CHECKS.sql'
      - 'docs/architecture/sql/V2-COACH-PERSISTENCE-TWO-OWNER-LOCAL.psql'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-foundation-clean-replay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  clean-foundation:
    name: Clean local Supabase Auth/Storage/pg_cron foundation replay
    if: github.ref == 'refs/heads/integration/v2-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Deliberately no Supabase access token, remote DB URL or deployment key.
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Verify applied foundation SQL has not drifted
        run: |
          node --test scripts/check-v2-applied-migration-integrity.test.mjs
          node scripts/check-v2-applied-migration-integrity.mjs
      - name: Boot isolated local Supabase services
        run: supabase start
      - name: Reset local-only foundation and replay every committed migration
        run: supabase db reset --local --no-seed
      - name: Verify local foundation objects, permissions and migration count
        run: |
          # Local CLI only. Do not use --remote, --linked, --db-url or db push.
          supabase migration list --local
          supabase status
      - name: Verify real foundation SQL/RLS/cron in the local Postgres container
        run: |
          set -euo pipefail
          db_container="$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n 1)"
          test -n "$db_container"
          docker cp scripts/test-v2-applied-foundation-local-postgres.psql "$db_container:/tmp/v2-foundation-qa.psql"
          docker exec "$db_container" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/v2-foundation-qa.psql
      - name: Validate Coach conversation persistence and cross-owner isolation in disposable DB
        run: |
          set -euo pipefail
          # Review-only SQL: run ONLY against the Supabase CLI's local Docker
          # PostgreSQL container. No remote credentials or hosted migrations.
          test "${CI}" = "1"
          db_container="$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n 1)"
          test -n "$db_container"
          for file in \
            docs/architecture/sql/V2-COACH-PERSISTENCE-CANDIDATE.sql \
            docs/architecture/sql/V2-COACH-PERSISTENCE-SECURITY-CHECKS.sql \
            docs/architecture/sql/V2-COACH-PERSISTENCE-TWO-OWNER-LOCAL.psql; do
            docker cp "$file" "$db_container:/tmp/$(basename "$file")"
            docker exec "$db_container" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -f "/tmp/$(basename "$file")"
          done
      - name: Check foundation-to-canonical schema compatibility in disposable DB
        run: |
          set -euo pipefail
          # The real foundation is already applied. These remain review-only
          # candidate sources, loaded solely into the local ephemeral DB.
          db_container="$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n 1)"
          test -n "$db_container"
          for file in \
            docs/architecture/sql/V2-TRAINING-COMPLETED-IDENTITY-OWNER-CANDIDATE.sql \
            docs/architecture/sql/V2-TRAINING-PLAN-CALENDAR-OWNER-CANDIDATE.sql; do
            docker cp "$file" "$db_container:/tmp/$(basename "$file")"
            docker exec "$db_container" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -f "/tmp/$(basename "$file")"
          done
          docker exec -i "$db_container" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $check$
          BEGIN
            IF to_regclass('public.v2_training_plans') IS NULL
               OR to_regclass('public.v2_completed_activities') IS NULL
               OR to_regclass('public.v2_training_revision_sessions') IS NULL
            THEN RAISE EXCEPTION 'Training/Activity candidate objects absent'; END IF;
            IF EXISTS (
              SELECT 1 FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
              WHERE n.nspname='public' AND c.relname IN
                ('v2_training_plans','v2_completed_activities','v2_training_revision_sessions')
                AND NOT c.relrowsecurity
            ) THEN RAISE EXCEPTION 'Training/Activity RLS disabled'; END IF;
            IF has_table_privilege('authenticated','public.v2_training_plans','INSERT')
               OR has_table_privilege('anon','public.v2_completed_activities','SELECT')
            THEN RAISE EXCEPTION 'Unreviewed candidate client grants'; END IF;
            RAISE NOTICE 'PASS: 18 real foundation migrations + owner identity/calendar DDL';
          END $check$;
          SQL
      - name: Replay full canonical Training and Completed Activity candidate graph
        run: |
          set -euo pipefail
          # Review-only DDL on a disposable Supabase local DB, never a remote target.
          db_container="$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n 1)"
          test -n "$db_container"
          for file in \
            docs/architecture/sql/V2-TRAINING-IMMUTABLE-REVISION-GUARD-CANDIDATE.sql \
            docs/architecture/sql/V2-TRAINING-PLAN-ACCEPTANCE-WRITER-CANDIDATE.sql \
            docs/architecture/sql/V2-TRAINING-SESSION-LIFECYCLE-WRITER-CANDIDATE.sql \
            docs/architecture/sql/V2-TRAINING-AUTH-OWNER-GATEWAY-CANDIDATE.sql \
            docs/architecture/sql/V2-COMPLETED-ACTIVITY-SOURCE-WRITER-CANDIDATE.sql \
            docs/architecture/sql/V2-COMPLETED-ACTIVITY-SCALAR-METRICS-CANDIDATE.sql \
            docs/architecture/sql/V2-COMPLETED-ACTIVITY-METRIC-DEFINITION-GUARD-CANDIDATE.sql \
            docs/architecture/sql/V2-COMPLETED-ACTIVITY-SEGMENTS-CANDIDATE.sql \
            docs/architecture/sql/V2-COMPLETED-ACTIVITY-STRENGTH-SETS-CANDIDATE.sql \
            docs/architecture/sql/V2-COMPLETED-ACTIVITY-SCALAR-READ-CANDIDATE.sql \
            docs/architecture/sql/V2-TRAINING-COMPLETION-ACK-CANDIDATE.sql \
            docs/architecture/sql/V2-TRAINING-ACTIVITY-OUTBOX-WRITER-CANDIDATE.sql \
            docs/architecture/sql/V2-TRAINING-START-PLANNED-WORKOUT-CANDIDATE.sql \
            docs/architecture/sql/V2-INDOOR-WEEKLY-COMPETITION-OWNER-CANDIDATE.sql \
            docs/architecture/sql/V2-INDOOR-WEEKLY-SCORE-V1-CANDIDATE.sql \
            docs/architecture/sql/V2-COMPLETED-ACTIVITY-EVIDENCE-OBJECTS-CANDIDATE.sql; do
            docker cp "$file" "$db_container:/tmp/$(basename "$file")"
            docker exec "$db_container" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -f "/tmp/$(basename "$file")"
          done
          docker exec -i "$db_container" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $gate$
          DECLARE
            v_count integer;
          BEGIN
            SELECT count(*) INTO v_count
            FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
            WHERE n.nspname IN ('public','allin_private')
              AND (c.relname LIKE 'v2_training_%'
                   OR c.relname='v2_completed_activities'
                   OR c.relname LIKE 'v2_activity_%'
                   OR c.relname LIKE 'v2_indoor_weekly_%')
              AND c.relkind IN ('r','p');
            IF v_count < 15 THEN
              RAISE EXCEPTION 'Canonical candidate graph incomplete: % tables',v_count;
            END IF;
            IF EXISTS(
              SELECT 1 FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
              WHERE n.nspname IN ('public','allin_private')
                AND (c.relname LIKE 'v2_training_%'
                     OR c.relname='v2_completed_activities'
                     OR c.relname LIKE 'v2_activity_%'
                     OR c.relname LIKE 'v2_indoor_weekly_%')
                AND c.relkind IN ('r','p') AND NOT c.relrowsecurity
            ) THEN RAISE EXCEPTION 'Candidate table with RLS disabled'; END IF;
            IF EXISTS(
              SELECT 1 FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
              WHERE n.nspname IN ('public','allin_private')
                AND (c.relname LIKE 'v2_training_%'
                     OR c.relname='v2_completed_activities'
                     OR c.relname LIKE 'v2_activity_%'
                     OR c.relname LIKE 'v2_indoor_weekly_%')
                AND c.relkind IN ('r','p')
                AND (has_table_privilege('anon',c.oid,'INSERT,UPDATE,DELETE')
                     OR has_table_privilege('authenticated',c.oid,'INSERT,UPDATE,DELETE'))
            ) THEN RAISE EXCEPTION 'Unsafe candidate direct client write grants'; END IF;
            IF NOT EXISTS(SELECT 1 FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace
                WHERE n.nspname='allin_private'
                  AND p.proname='v2_training_create_activity_from_outbox_candidate')
            THEN RAISE EXCEPTION 'Training-to-Activity outbox writer absent'; END IF;
            RAISE NOTICE 'PASS: full canonical candidate graph on real local 18-migration Supabase foundation';
          END $gate$;
          SQL
      - name: Verify canonical account deletion and export candidate bridge
        run: |
          set -euo pipefail
          # Review-only owner FK and export functions in local Supabase. The
          # hosted deletion worker and hosted export RPC are untouched.
          db_container="$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n 1)"
          test -n "$db_container"
          for file in \
            docs/architecture/sql/V2-TRAINING-ACTIVITY-OWNER-CASCADE-REVIEW-CANDIDATE.sql \
            docs/architecture/sql/V2-TRAINING-ACCOUNT-DELETION-HISTORY-GUARD-CANDIDATE.sql \
            docs/architecture/sql/V2-TRAINING-DIRECT-AUTH-CASCADE-REVIEW-CANDIDATE.sql \
            docs/architecture/sql/V2-TRAINING-ACCOUNT-EXPORT-FRAGMENT-CANDIDATE.sql \
            docs/architecture/sql/V2-ACCOUNT-EXPORT-TRAINING-INTEGRATION-REVIEW-CANDIDATE.sql; do
            docker cp "$file" "$db_container:/tmp/$(basename "$file")"
            docker exec "$db_container" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -f "/tmp/$(basename "$file")"
          done
          docker exec -i "$db_container" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $release$
          DECLARE
            owner_table record;
            required_user_column smallint;
          BEGIN
            FOR owner_table IN
              SELECT c.oid,c.relname,n.nspname
              FROM pg_class c
              JOIN pg_namespace n ON n.oid=c.relnamespace
              JOIN pg_attribute a ON a.attrelid=c.oid
                 AND a.attname='user_id' AND a.attnum>0 AND NOT a.attisdropped
              WHERE c.relkind IN ('r','p')
                AND n.nspname IN ('public','allin_private')
                AND (c.relname LIKE 'v2_training_%'
                     OR c.relname='v2_completed_activities'
                     OR c.relname LIKE 'v2_activity_%'
                     OR c.relname LIKE 'v2_indoor_weekly_%')
            LOOP
              SELECT attnum INTO required_user_column FROM pg_attribute
                WHERE attrelid=owner_table.oid AND attname='user_id';
              IF NOT EXISTS (
                SELECT 1 FROM pg_constraint f
                WHERE f.conrelid=owner_table.oid
                  AND f.contype='f' AND f.confrelid='auth.users'::regclass
                  AND f.confdeltype='c' AND f.conkey=ARRAY[required_user_column]::smallint[]
              ) THEN
                RAISE EXCEPTION 'User-owned candidate table lacks direct Auth cascade: %.%',
                  owner_table.nspname,owner_table.relname;
              END IF;
            END LOOP;
            IF NOT has_function_privilege('authenticated',
               'public.v2_export_my_account_snapshot(uuid)','EXECUTE')
               OR has_function_privilege('anon',
               'public.v2_export_my_account_snapshot(uuid)','EXECUTE')
            THEN RAISE EXCEPTION 'Canonical owner export grants changed'; END IF;
            IF to_regprocedure('allin_private.v2_training_account_export_fragment_candidate(uuid)') IS NULL
            THEN RAISE EXCEPTION 'Canonical Training export fragment absent'; END IF;
            IF position('v2_training_account_export_fragment_candidate'
               IN pg_get_functiondef('public.v2_export_my_account_snapshot(uuid)'::regprocedure))=0
            THEN RAISE EXCEPTION 'Existing owner export does not include new Training fragment'; END IF;
            RAISE NOTICE 'PASS: canonical Training/Activity direct owner cascade and existing export bridge';
          END $release$;
          SQL
      - name: Verify real Supabase API-role security on the complete candidate catalog
        run: |
          set -euo pipefail
          db_container="$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n 1)"
          test -n "$db_container"
          docker cp scripts/test-v2-training-local-role-boundaries.psql "$db_container:/tmp/v2-roles-qa.psql"
          docker exec "$db_container" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/v2-roles-qa.psql
      - name: Replay populated two-owner deletion and rollback on real local Auth
        run: |
          set -euo pipefail
          db_container="$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n 1)"
          test -n "$db_container"
          docker cp scripts/test-v2-training-local-populated-owner-deletion.psql "$db_container:/tmp/v2-owner-deletion.psql"
          docker exec "$db_container" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/v2-owner-deletion.psql
      - name: Seed populated V2 owner accounts before billing candidate upgrade
        run: |
          set -euo pipefail
          # Seed committed owner rows AFTER foundation migrations but BEFORE
          # installing the review-only billing candidate in disposable local PG.
          db_container="$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n 1)"
          test -n "$db_container"
          docker cp scripts/test-v2-billing-preupgrade-seed.psql "$db_container:/tmp/v2-billing-preupgrade-seed.psql"
          docker exec "$db_container" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/v2-billing-preupgrade-seed.psql
      - name: Prove populated billing DDL and service grants can rollback atomically
        run: |
          set -euo pipefail
          # Review-only rollback rehearsal, inside disposable local Supabase.
          # No migration files or remote connection are involved.
          db_container="$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n 1)"
          test -n "$db_container"
          for file in \
            docs/architecture/sql/V2-SUBSCRIPTION-VERIFIED-LEDGER-CANDIDATE.sql \
            docs/architecture/sql/V2-SUBSCRIPTION-SERVICE-GRANTS-CANDIDATE.sql; do
            docker cp "$file" "$db_container:/tmp/$(basename "$file")"
          done
          docker cp scripts/test-v2-billing-schema-rollback-local.psql "$db_container:/tmp/v2-billing-schema-rollback.psql"
          docker exec "$db_container" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/v2-billing-schema-rollback.psql
      - name: Verify billing candidate against real local foundation Auth and two accounts
        run: |
          set -euo pipefail
          # Review-only DDL and exact service permissions on ephemeral local
          # Supabase. NEVER use --remote, --linked, --db-url or db push.
          db_container="$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n 1)"
          test -n "$db_container"
          for file in \
            docs/architecture/sql/V2-SUBSCRIPTION-VERIFIED-LEDGER-CANDIDATE.sql \
            docs/architecture/sql/V2-SUBSCRIPTION-SERVICE-GRANTS-CANDIDATE.sql; do
            docker cp "$file" "$db_container:/tmp/$(basename "$file")"
            docker exec "$db_container" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -f "/tmp/$(basename "$file")"
          done
          docker cp scripts/test-v2-billing-local-foundation.psql "$db_container:/tmp/v2-billing-foundation-qa.psql"
          docker exec "$db_container" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/v2-billing-foundation-qa.psql
      - name: Restore synthetic billing ledger from a real local PostgreSQL backup
        run: |
          set -euo pipefail
          # This is strictly the disposable Supabase CLI container created
          # above. Never run pg_dump/restore on a linked or remote database.
          test "${CI}" = "1"
          db_container="$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n 1)"
          test -n "$db_container"
          docker cp scripts/test-v2-billing-backup-seed-local.psql "$db_container:/tmp/v2-billing-backup-seed.psql"
          docker exec "$db_container" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/v2-billing-backup-seed.psql
          # Store a custom-format database backup of ONLY the three candidate
          # billing tables. Receipts and users are entirely synthetic.
          docker exec "$db_container" pg_dump -U postgres -d postgres -Fc --data-only \
            -t allin_private.v2_subscription_checkout_attempts \
            -t allin_private.v2_subscription_purchases \
            -t allin_private.v2_subscription_verified_events \
            -f /tmp/v2-local-synthetic-billing.dump
          docker exec -i "$db_container" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          -- Simulate an accidental missing ledger, inside the ephemeral
          -- database only. Auth profiles remain, so FKs are valid on restore.
          DELETE FROM allin_private.v2_subscription_checkout_attempts
           WHERE owner_id IN
            ('77777777-7777-4777-8777-777777777777',
             '88888888-8888-4888-8888-888888888888');
          DO $depleted$
          BEGIN
            IF EXISTS(SELECT 1 FROM allin_private.v2_subscription_checkout_attempts)
              OR EXISTS(SELECT 1 FROM allin_private.v2_subscription_purchases)
              OR EXISTS(SELECT 1 FROM allin_private.v2_subscription_verified_events) THEN
              RAISE EXCEPTION 'Local ledger rows were not removed before restore';
            END IF;
          END $depleted$;
          SQL
          docker exec "$db_container" pg_restore -U postgres -d postgres \
            --data-only --no-owner --no-privileges --exit-on-error \
            /tmp/v2-local-synthetic-billing.dump
          docker cp scripts/test-v2-billing-backup-restored-local.psql "$db_container:/tmp/v2-billing-backup-restored.psql"
          docker exec "$db_container" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/v2-billing-backup-restored.psql
          docker exec "$db_container" rm -f /tmp/v2-local-synthetic-billing.dump
      - name: Replay canonical Goals identity owner candidate
        run: |
          set -euo pipefail
          # Owner proposal only, never a hosted migration.
          db_container="$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n 1)"
          test -n "$db_container"
          docker cp docs/architecture/sql/V2-GOALS-IDENTITY-REVISION-OWNER-CANDIDATE.sql "$db_container:/tmp/v2-goals-owner.sql"
          docker cp docs/architecture/sql/V2-GOALS-REVISION-HISTORY-GUARD-CANDIDATE.sql "$db_container:/tmp/v2-goals-history.sql"
          docker cp docs/architecture/sql/V2-GOALS-REVISION-ACCEPTANCE-WRITER-CANDIDATE.sql "$db_container:/tmp/v2-goals-acceptance.sql"
          docker cp scripts/test-v2-goals-acceptance-local-postgres.psql "$db_container:/tmp/v2-goals-acceptance-qa.psql"
          docker cp scripts/test-v2-goals-owner-local-postgres.psql "$db_container:/tmp/v2-goals-owner-qa.psql"
          docker exec "$db_container" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/v2-goals-owner.sql
          docker exec "$db_container" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/v2-goals-history.sql
          docker exec "$db_container" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/v2-goals-owner-qa.psql
