name: ALL-251 protected hosted Storage HTTP route matrix
# Explicit one-workflow/script-path push may REQUEST reviewer approval;
# it cannot run secret-bearing probes until all251-temporary-staging approval.
# Keep all other commits out of this test; never expose secrets on push.
on:
  workflow_dispatch:
  push:
    branches:
      - integration/v2-foundation
    paths:
      - .github/workflows/v2-all251-hosted-http-route-matrix.yml
      - scripts/test-all251-hosted-storage-http-routes.mjs
permissions:
  contents: read
concurrency:
  group: all251-staging-http-route-matrix
  cancel-in-progress: false
jobs:
  offline-script-syntax-only:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: |
          node --check scripts/test-all251-hosted-storage-http-routes.mjs
          node --check scripts/all251-s3-sigv4.mjs
  protected-disposable-staging-only:
    needs: offline-script-syntax-only
    if: github.ref == 'refs/heads/integration/v2-foundation'
    runs-on: ubuntu-latest
    environment: all251-temporary-staging
    timeout-minutes: 12
    env:
      CI: 'true'
      ALL251_HTTP_MATRIX_APPROVED: 'true'
      ALL251_STAGING_REF: fbtgknlxjyeqrxemskbl
      ALL251_STAGING_URL: https://fbtgknlxjyeqrxemskbl.supabase.co
      ALL251_TEMP_STAGING_SECRET_KEY: ${{ secrets.ALL251_TEMP_STAGING_SECRET_KEY }}
      ALL251_TEMP_STAGING_WRITER_SIGNER_B64: ${{ secrets.ALL251_TEMP_STAGING_WRITER_SIGNER_B64 }}
      # Optional ONLY after separate custody, deletion-barrier and cost review.
      # Generated S3 keypairs bypass Storage RLS and may reveal a real bypass.
      ALL251_TEMP_STAGING_S3_ACCESS_KEY_ID: ${{ secrets.ALL251_TEMP_STAGING_S3_ACCESS_KEY_ID }}
      ALL251_TEMP_STAGING_S3_SECRET_ACCESS_KEY: ${{ secrets.ALL251_TEMP_STAGING_S3_SECRET_ACCESS_KEY }}
      ALL251_TEMP_STAGING_S3_REGION: ${{ vars.ALL251_TEMP_STAGING_S3_REGION }}
      ALL251_TEMP_STAGING_PUBLISHABLE_KEY: ${{ vars.ALL251_TEMP_STAGING_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Validate staging-only protected inputs without disclosing credentials
        run: |
          test "${ALL251_STAGING_REF}" = 'fbtgknlxjyeqrxemskbl'
          test -n "${ALL251_TEMP_STAGING_SECRET_KEY}"
          test -n "${ALL251_TEMP_STAGING_PUBLISHABLE_KEY}"
          node --check scripts/test-all251-hosted-storage-http-routes.mjs
          node --check scripts/all251-s3-sigv4.mjs
      - name: Exercise disposable hosted Storage REST, signed, S3 unsigned, TUS and delayed upload checks
        run: node scripts/test-all251-hosted-storage-http-routes.mjs
# Do not interpret a green unsigned-S3 probe as credentialed S3 acceptance.
# Do not enable account deletion or mark uploadBarrierEnforced=true from this workflow.
