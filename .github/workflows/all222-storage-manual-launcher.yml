name: ALL-222 manual launcher (disposable staging only)

# Default-branch entry point for protected staging HTTP acceptance.
# NEVER trigger on push or PR. Does not merge integration, deploy, or change production.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: all222-storage-http-disposable-staging
  cancel-in-progress: false

jobs:
  real-auth-upload-denials:
    if: github.repository == 'allinproject/All-In-V2' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: all251-temporary-staging
    timeout-minutes: 10
    env:
      CI: 'true'
      ALL222_STORAGE_HTTP_ALLOW: 'true'
      ALL251_STAGING_REF: fbtgknlxjyeqrxemskbl
      ALL251_STAGING_URL: https://fbtgknlxjyeqrxemskbl.supabase.co
      ALL251_TEMP_STAGING_SECRET_KEY: ${{ secrets.ALL251_TEMP_STAGING_SECRET_KEY }}
      ALL251_TEMP_STAGING_PUBLISHABLE_KEY: ${{ vars.ALL251_TEMP_STAGING_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout pinned reviewed integration test only
        uses: actions/checkout@v4
        with:
          ref: ef5be237875622b34bcb872840b0834d469cf6ca
          persist-credentials: false
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute genuine staging Auth and Storage bypass tests
        run: node scripts/test-v2-all222-storage-http-denials.mjs
