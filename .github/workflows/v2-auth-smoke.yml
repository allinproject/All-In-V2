name: V2 Node smoke (dependency-free)

on:
  push:
    branches:
      - integration/v2-foundation
    paths:
      - 'apps/mobile-v2/app/**'
      - 'apps/mobile-v2/src/auth/**'
      - 'apps/mobile-v2/src/features/cookbook/**'
      - 'apps/mobile-v2/src/features/training/**'
      - 'apps/mobile-v2/src/features/strength/**'
      - 'apps/mobile-v2/package.json'
      - 'apps/mobile-v2/src/types/database.types.ts'
      - '.github/workflows/v2-auth-smoke.yml'
      - 'scripts/check-v2-supabase-target.mjs'
      - 'scripts/check-v2-supabase-target.test.mjs'
      - 'scripts/check-v2-dependency-manifest.mjs'
      - 'scripts/check-v2-dependency-manifest.test.mjs'
      - 'scripts/prepare-v2-lockfile.ps1'
      - 'scripts/prepare-v2-lockfile.test.mjs'
      - 'scripts/prepare-v2-usda-foundation-snapshot.ps1'
      - 'scripts/prepare-v2-usda-foundation-snapshot.test.mjs'
      - 'scripts/verify-v2-usda-foundation-manifest.mjs'
      - 'scripts/verify-v2-usda-foundation-manifest.test.mjs'
      - 'scripts/check-v2-ci-cost-policy.test.mjs'
      - 'supabase/config.toml'
      - 'supabase/functions/_shared/**'
      - 'apps/mobile-v2/.env.example'
  pull_request:
    paths:
      - 'apps/mobile-v2/app/**'
      - 'apps/mobile-v2/src/auth/**'
      - 'apps/mobile-v2/src/features/cookbook/**'
      - 'apps/mobile-v2/src/features/training/**'
      - 'apps/mobile-v2/src/features/strength/**'
      - 'apps/mobile-v2/package.json'
      - 'apps/mobile-v2/src/types/database.types.ts'
      - '.github/workflows/v2-auth-smoke.yml'
      - 'scripts/check-v2-supabase-target.mjs'
      - 'scripts/check-v2-supabase-target.test.mjs'
      - 'scripts/check-v2-dependency-manifest.mjs'
      - 'scripts/check-v2-dependency-manifest.test.mjs'
      - 'scripts/prepare-v2-lockfile.ps1'
      - 'scripts/prepare-v2-lockfile.test.mjs'
      - 'scripts/prepare-v2-usda-foundation-snapshot.ps1'
      - 'scripts/prepare-v2-usda-foundation-snapshot.test.mjs'
      - 'scripts/verify-v2-usda-foundation-manifest.mjs'
      - 'scripts/verify-v2-usda-foundation-manifest.test.mjs'
      - 'scripts/check-v2-ci-cost-policy.test.mjs'
      - 'supabase/config.toml'
      - 'supabase/functions/_shared/**'
      - 'apps/mobile-v2/.env.example'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-auth-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-smoke:
    name: Node-only Auth, Cookbook, Training and provider-cache tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/mobile-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify V2 Supabase target isolation
        run: node ../../scripts/check-v2-supabase-target.mjs
      - name: Test V2 Supabase guard rejection cases
        run: node --test ../../scripts/check-v2-supabase-target.test.mjs
      - name: Verify pinned React dependency versions
        run: node ../../scripts/check-v2-dependency-manifest.mjs
      - name: Test React pin and lockfile drift guards
        run: node --test ../../scripts/check-v2-dependency-manifest.test.mjs
      - name: Guard V2 CI spending and full release validation gates
        run: node --test ../../scripts/check-v2-ci-cost-policy.test.mjs
      - name: Test Windows lockfile helper safety
        run: node --test ../../scripts/prepare-v2-lockfile.test.mjs
      - name: Test USDA source acquisition safety
        run: node --test ../../scripts/prepare-v2-usda-foundation-snapshot.test.mjs
      - name: Test USDA archive manifest verification
        run: node --test ../../scripts/verify-v2-usda-foundation-manifest.test.mjs
      - name: Run Auth tests
        run: npm run test:auth
      - name: Run Cookbook calculator tests
        run: npm run test:calculator
      - name: Run Training logic tests
        run: npm run test:training-logic
      - name: Run Strength exercise-science contract tests
        run: npm run test:strength
      - name: Run Strength exercise suitability tests
        run: node --experimental-strip-types --test src/features/strength/exerciseSuitability.test.ts
      - name: Run provider cache helper tests
        run: npm run test:provider-cache
