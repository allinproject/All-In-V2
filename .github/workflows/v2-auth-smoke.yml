  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-auth-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  auth-smoke:
    name: Node-only Auth, Cookbook, Training and provider-cache tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/mobile-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify V2 Supabase target isolation
        run: node ../../scripts/check-v2-supabase-target.mjs
      - name: Check native watch target generation and safe pairing handoff (no Xcode, no hardware)
        run: node --experimental-strip-types --test ../../scripts/test-v2-watch-native-target.mjs
      - name: Test V2 Supabase guard rejection cases
        run: node --test ../../scripts/check-v2-supabase-target.test.mjs
      - name: Verify pinned React dependency versions
        run: node ../../scripts/check-v2-dependency-manifest.mjs
      - name: Test React pin and lockfile drift guards
        run: node --test ../../scripts/check-v2-dependency-manifest.test.mjs
      - name: Verify committed V2 migration provenance (static, no database)
        run: node ../../scripts/check-v2-applied-migration-integrity.mjs
      - name: Test migration integrity rejection cases
        run: node --test ../../scripts/check-v2-applied-migration-integrity.test.mjs
      - name: Guard V2 CI spending and full release validation gates
        run: node --test ../../scripts/check-v2-ci-cost-policy.test.mjs
      - name: Test Windows lockfile helper safety
        run: node --test ../../scripts/prepare-v2-lockfile.test.mjs
      - name: Test USDA source acquisition safety
        run: node --test ../../scripts/prepare-v2-usda-foundation-snapshot.test.mjs
      - name: Test USDA archive manifest verification
        run: node --test ../../scripts/verify-v2-usda-foundation-manifest.test.mjs
      - name: Validate disabled account-deletion worker policy and non-retry execution
        run: |
          node --experimental-strip-types --test ../../supabase/functions/v2-account-deletion-worker/policy.test.mjs ../../supabase/functions/v2-account-deletion-worker/execution.test.mjs
      - name: Validate private account-export Storage and retention adapters
        run: |
          node --test ../../supabase/functions/_shared/trainingExportSupabaseArchive.node.test.mjs
          node --test ../../supabase/functions/_shared/trainingExportMediaCoverage.node.test.mjs
          node --test ../../supabase/functions/_shared/trainingExportLargeArchive.node.test.mjs
          node --test ../../supabase/functions/_shared/trainingExportKeyLease.node.test.mjs
          node --test ../../supabase/functions/_shared/trainingExportAwsKms.node.test.mjs
          node --test ../../supabase/functions/_shared/trainingExportPrivateMediaPages.node.test.mjs
          node --test ../../supabase/functions/_shared/trainingExportCanonicalPgReader.node.test.mjs
          (cd ../.. && node --test scripts/test-v2-account-export-catalog-alignment.mjs)
          node --test ../../supabase/functions/_shared/trainingExportDownloadVerifier.node.test.mjs
          node --test ../../supabase/functions/_shared/trainingExportDownloadHandler.node.test.mjs
          node --experimental-strip-types --test src/features/profile/accountExportLargeFile.test.ts
          node --test ../../scripts/v2-training-account-export-worker-candidate.test.mjs
          node --test ../../scripts/v2-training-export-archive-writer.test.mjs
          node --test ../../supabase/functions/_shared/trainingExportSupabaseStorage.node.test.mjs
          node --test ../../scripts/v2-training-private-storage-stage.test.mjs
          node --test ../../scripts/v2-training-storage-export-integrity.test.mjs
          node --test ../../scripts/v2-training-encrypted-export-envelope.test.mjs
      - name: Run staged Goal approval authentication tests
        run: node --test ../../supabase/functions/_shared/goalAcceptanceAuthServices.node.test.mjs
      - name: Run Auth tests
        run: npm run test:auth
      # ALL-247 regression must be observable even if a parallel Coach
      # workstream introduces a failing test later in this same job.
      - name: Run Training logic tests
        run: npm run test:training-logic
      - name: Run Cookbook calculator tests
        run: npm run test:calculator
      - name: Validate review-only Kitchen plan owner and permissions
        run: node --test ../../scripts/test-v2-kitchen-plan-candidate.test.mjs
      - name: Run Community and Live Props contract tests
        run: npm run test:community
      - name: Run Coach quality contract and scenario tests
        run: npm run test:coach-quality
      - name: Run Strength exercise-science contract tests
        run: npm run test:strength
      - name: Run Strength exercise suitability tests
        run: node --experimental-strip-types --test src/features/strength/exerciseSuitability.test.ts
      - name: Run Sentry crash privacy tests
        run: npm run test:monitoring
      - name: Run provider cache helper tests
        run: npm run test:provider-cache

  subscription-contracts:
    name: Node-only subscription contracts (isolated timeout)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        working-directory: apps/mobile-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Run subscription entitlement contract tests
        run: npm run test:subscriptions
      - name: Attest exact review-only billing SQL and service-role source digests
        run: node ../../scripts/attest-v2-billing-release-sources.mjs

  community-postgres-candidate:
    name: PostgreSQL 17 isolated Community, subscription and Coach replays
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: allin_community_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d allin_community_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: allin_community_test
    steps:
      - uses: actions/checkout@v4
      - name: Execute candidate and verify privacy, constraints and deletion cascade
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER_ID" mkdir -p /tmp/allin/scripts /tmp/allin/docs/architecture/sql
          docker cp scripts/test-v2-community-sql-postgres.psql "$POSTGRES_CONTAINER_ID:/tmp/allin/scripts/test-v2-community-sql-postgres.psql"
          docker cp docs/architecture/sql/V2-COMMUNITY-PRIVACY-OWNER-CANDIDATE.sql "$POSTGRES_CONTAINER_ID:/tmp/allin/docs/architecture/sql/V2-COMMUNITY-PRIVACY-OWNER-CANDIDATE.sql"
          docker cp docs/architecture/sql/V2-COMMUNITY-RELATIONSHIP-WRITER-CANDIDATE.sql "$POSTGRES_CONTAINER_ID:/tmp/allin/docs/architecture/sql/V2-COMMUNITY-RELATIONSHIP-WRITER-CANDIDATE.sql"
          docker cp scripts/test-v2-community-writer-postgres.psql "$POSTGRES_CONTAINER_ID:/tmp/allin/scripts/test-v2-community-writer-postgres.psql"
          docker exec "$POSTGRES_CONTAINER_ID" psql -U "$PGUSER" -d "$PGDATABASE" -v ON_ERROR_STOP=1 -f /tmp/allin/scripts/test-v2-community-writer-postgres.psql
      - name: Verify subscription review candidate in separate disposable database
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER_ID" createdb -U "$PGUSER" allin_subscription_test
          docker cp scripts/test-v2-subscription-sql-postgres.psql "$POSTGRES_CONTAINER_ID:/tmp/allin/scripts/test-v2-subscription-sql-postgres.psql"
          docker cp docs/architecture/sql/V2-SUBSCRIPTION-VERIFIED-LEDGER-CANDIDATE.sql "$POSTGRES_CONTAINER_ID:/tmp/allin/docs/architecture/sql/V2-SUBSCRIPTION-VERIFIED-LEDGER-CANDIDATE.sql"
          docker cp docs/architecture/sql/V2-SUBSCRIPTION-SERVICE-GRANTS-CANDIDATE.sql "$POSTGRES_CONTAINER_ID:/tmp/allin/docs/architecture/sql/V2-SUBSCRIPTION-SERVICE-GRANTS-CANDIDATE.sql"
          docker exec "$POSTGRES_CONTAINER_ID" psql -U "$PGUSER" -d allin_subscription_test -v ON_ERROR_STOP=1 -f /tmp/allin/scripts/test-v2-subscription-sql-postgres.psql
      - name: Verify subscription concurrent refund replay in same disposable database
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: bash scripts/test-v2-subscription-race-postgres.sh
      - name: Verify Coach owner and request-fencing in a separate disposable database
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER_ID" createdb -U "$PGUSER" allin_coach_test
          docker exec "$POSTGRES_CONTAINER_ID" mkdir -p /tmp/allin/supabase/tests
          docker cp scripts/test-v2-coach-sql-postgres.psql "$POSTGRES_CONTAINER_ID:/tmp/allin/scripts/test-v2-coach-sql-postgres.psql"
          docker cp docs/architecture/sql/V2-COACH-OWNER-MIGRATION-CANDIDATE.sql "$POSTGRES_CONTAINER_ID:/tmp/allin/docs/architecture/sql/V2-COACH-OWNER-MIGRATION-CANDIDATE.sql"
          docker cp supabase/tests/v2_coach_owner_atomic_exchange_rollback.sql "$POSTGRES_CONTAINER_ID:/tmp/allin/supabase/tests/v2_coach_owner_atomic_exchange_rollback.sql"
          docker exec "$POSTGRES_CONTAINER_ID" psql -U "$PGUSER" -d allin_coach_test -v ON_ERROR_STOP=1 -f /tmp/allin/scripts/test-v2-coach-sql-postgres.psql
      - name: Verify Coach private spend ledger in isolated PostgreSQL 17
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER_ID" createdb -U "$PGUSER" allin_coach_budget_test
          docker cp scripts/test-v2-coach-budget-postgres.psql "$POSTGRES_CONTAINER_ID:/tmp/allin/scripts/test-v2-coach-budget-postgres.psql"
          docker cp docs/architecture/sql/V2-COACH-BUDGET-LEDGER-REVIEW-CANDIDATE.sql "$POSTGRES_CONTAINER_ID:/tmp/allin/docs/architecture/sql/V2-COACH-BUDGET-LEDGER-REVIEW-CANDIDATE.sql"
          docker exec "$POSTGRES_CONTAINER_ID" psql -U "$PGUSER" -d allin_coach_budget_test -v ON_ERROR_STOP=1 -f /tmp/allin/scripts/test-v2-coach-budget-postgres.psql
      - name: Verify Coach claim concurrency across independent PostgreSQL backends
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER_ID" createdb -U "$PGUSER" allin_coach_race_test
          docker cp scripts/test-v2-coach-race-setup.psql "$POSTGRES_CONTAINER_ID:/tmp/allin/scripts/test-v2-coach-race-setup.psql"
          # The shared setup includes v2-coach-owner.sql relative to itself.
          # Copy the same canonical candidate for this separate PostgreSQL 17 test.
          docker cp docs/architecture/sql/V2-COACH-OWNER-MIGRATION-CANDIDATE.sql "$POSTGRES_CONTAINER_ID:/tmp/allin/scripts/v2-coach-owner.sql"
          docker exec "$POSTGRES_CONTAINER_ID" psql -U "$PGUSER" -d allin_coach_race_test -v ON_ERROR_STOP=1 -f /tmp/allin/scripts/test-v2-coach-race-setup.psql
          bash scripts/test-v2-coach-race-postgres.sh

  watch-native-project:
    name: ALL-243 generated Watch Xcodeproj and Swift syntax (Ubuntu, no Xcode)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install only xcodeproj project-file parser (no Apple toolchain)
        run: gem install xcodeproj -v 1.27.0 --no-document
      - name: Create two disposable watch target generations and verify the resulting project
        run: ruby scripts/test-v2-watch-xcodeproj.rb
      - name: Parse every canonical iOS/watchOS Swift source, without claiming platform compilation
        run: |
          set -euo pipefail
          if ! command -v swiftc >/dev/null 2>&1; then
            echo 'Swift parser unavailable on this Ubuntu image; native Swift syntax remains unverified'
            exit 1
          fi
          for source in apps/mobile-v2/native/apple-watch/*.swift; do
            echo "Swift parse: $source"
            swiftc -frontend -parse "$source"
          done
          echo 'PASS ALL-243 Linux Swift parser (not Apple SDK or Xcode compilation)'
