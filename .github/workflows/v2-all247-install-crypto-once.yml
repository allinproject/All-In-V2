name: ALL-247 one-time secure UUID dependency sync
on:
  push:
    branches: [integration/v2-foundation]
    paths:
      - .github/workflows/v2-all247-install-crypto-once.yml

permissions:
  contents: write

concurrency:
  group: all247-one-time-crypto-install
  cancel-in-progress: false

jobs:
  install-crypto:
    if: github.ref == 'refs/heads/integration/v2-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile-v2/package-lock.json
      - name: Ensure exact baseline and supported Expo SDK
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "integration/v2-foundation"
          node -e "const p=require('./apps/mobile-v2/package.json');if(!/^~58[.]/.test(p.dependencies.expo))process.exit(1);if(p.dependencies['expo-crypto'])throw Error('Already installed; abort one-time sync')"
      - name: Generate real npm lockfile; never guess tarball integrity
        working-directory: apps/mobile-v2
        env:
          npm_config_ignore_scripts: 'true'
        run: |
          npm ci --no-audit --no-fund
          npm install --package-lock-only --save 'expo-crypto@~58.0.8' --no-audit --no-fund
          npm ci --no-audit --no-fund
          node - <<'NODE'
          const p=require('./package.json');
          const l=require('./package-lock.json');
          if(p.dependencies['expo-crypto']!=='~58.0.8')throw Error('Wrong Expo package range');
          if(l.packages[''].dependencies['expo-crypto']!=='~58.0.8')throw Error('Lockfile root mismatch');
          if(!l.packages['node_modules/expo-crypto']?.integrity)throw Error('Registry integrity absent');
          NODE
      - name: Commit ONLY paired dependency files if no other work advanced
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain | grep -vE '^ M apps/mobile-v2/package(-lock)?[.]json$' || true)"
          git add -- apps/mobile-v2/package.json apps/mobile-v2/package-lock.json
          git diff --cached --quiet && { echo 'No package changes'; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(ALL-247): install Expo SDK 58 secure UUID dependency and lockfile"
          git fetch origin integration/v2-foundation
          test "$(git rev-parse origin/integration/v2-foundation)" = "$GITHUB_SHA" || {
            echo 'Integration branch changed: refusing to overwrite or rebase newer work'
            exit 1
          }
          git push origin HEAD:refs/heads/integration/v2-foundation
